name: Teacher manual and native help checks
on:
  pull_request:
    branches: ["feature/lesson-source-0.1.101"]
permissions:
  contents: read
concurrency:
  group: teacher-guide-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 60
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record source and build the offline manual
        shell: python
        run: |
          import json,pathlib,subprocess,sys
          out=pathlib.Path('teacher-qa');out.mkdir(exist_ok=True)
          files=['test_complete_readme.py','test_teacher_scenarios.py','test_teacher_help_ui.py',
              'test_desktop_studio_ui.py','test_maintenance_release_safety.py']
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          (out/'source.json').write_text(json.dumps({'source_commit':sha,'test_files':files,
              'scope':'Windows source; synthetic data; no new EXE or Release; no live model calls'},indent=2),encoding='utf-8')
          subprocess.run([sys.executable,'runtime/deeptutor_shchem/export_teacher_handbook.py',str(out)],check=True)
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile, check scenario documentation and run native help regressions
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
          SHCHEM_CANDIDATE_SCREENSHOTS: teacher-qa/screenshots
        run: |
          import json,pathlib,subprocess,sys
          subprocess.run([sys.executable,'-m','compileall','-q','integrations','runtime/deeptutor_shchem'],check=True)
          subprocess.run([sys.executable,'runtime/deeptutor_shchem/documentation_policy.py'],check=True)
          names=json.loads(pathlib.Path('teacher-qa/source.json').read_text())['test_files']
          subprocess.run([sys.executable,'-m','pytest','-q',
              *['staging/coordination/deeptutor_gateway/tests/'+n for n in names],
              '--junitxml=teacher-qa/pytest.xml'],check=True)
      - name: Preserve exact patch, guide metrics and evidence
        if: always()
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,xml.etree.ElementTree as ET
          out=pathlib.Path('teacher-qa');out.mkdir(exist_ok=True)
          base='0e395471eb55ab8181e79b6242ee5510694628b6'
          old=subprocess.check_output(['git','show',base+':README.md']).decode('utf-8')
          new=pathlib.Path('README.md').read_text(encoding='utf-8')
          (out/'teacher-guide.patch').write_bytes(subprocess.check_output(['git','diff','--binary',base,'HEAD','--']))
          metrics={'old_readme_lines':len(old.splitlines()),'new_readme_lines':len(new.splitlines()),
              'old_readme_characters':len(old),'new_readme_characters':len(new),
              'teacher_chapters':[str(p) for p in pathlib.Path('docs/teacher').glob('*.md')]}
          (out/'guide-metrics.json').write_text(json.dumps(metrics,indent=2),encoding='utf-8')
          print('GUIDE_METRICS',json.dumps(metrics))
          report=out/'pytest.xml'
          if report.exists():print('JUNIT',json.dumps([x.attrib for x in ET.parse(report).getroot().iter('testsuite')]))
          inventory={str(p.relative_to(out)).replace('\\','/'):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in out.rglob('*') if p.is_file() and p.name!='sha256.json'}
          (out/'sha256.json').write_text(json.dumps(inventory,indent=2),encoding='utf-8')
          print('EVIDENCE_SHA256',json.dumps(inventory))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teacher-guide-${{ github.run_id }}
          path: |
            teacher-qa/
            README.md
            docs/teacher/
            docs/maintainer/README.md
            docs/qa/2026-09-20-teacher-guide.md
            docs/screenshots/v0.1.100/lesson-design-editor.png
            docs/screenshots/v0.1.96/student-review-wide.png
            docs/screenshots/v0.1.98/exam-overview.png
          if-no-files-found: error
          retention-days: 14
