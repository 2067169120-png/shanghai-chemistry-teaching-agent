name: Existing lesson import first look
on:
  push:
    branches: ["feature/lesson-source-0.1.101"]
permissions:
  contents: read
concurrency:
  group: lesson101-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  first-look:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Conversion, original editing and backup roundtrip
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          staging/coordination/deeptutor_gateway/tests/test_lesson_import.py
          staging/coordination/deeptutor_gateway/tests/test_lesson_import_ui.py
          staging/coordination/deeptutor_gateway/tests/test_lesson_output_backup.py
          staging/coordination/deeptutor_gateway/tests/test_complete_readme.py
          --junitxml=first-look/pytest.xml
      - name: Real source picker, subset import and three restored files
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/desktop_teacher_workbench.pyw --verify-lesson-import-lite first-look/lesson-import
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson101-first-${{ github.sha }}
          path: first-look/
          retention-days: 14
