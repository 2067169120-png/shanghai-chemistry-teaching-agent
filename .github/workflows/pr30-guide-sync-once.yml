name: Sync verified PR30 guide once
on:
  push:
    branches: ["maintenance/exam-practice-20260919"]
    paths: [".github/workflows/pr30-guide-sync-once.yml"]
permissions:
  contents: read
jobs:
  guide:
    if: github.repository == '2067169120-png/shanghai-chemistry-teaching-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: exam-practice-35442822861
          run-id: 35442822861
          github-token: ${{ github.token }}
          path: .guide-evidence
      - name: Verify evidence and change only the guide and two real screenshots
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          branch = 'maintenance/exam-practice-20260919'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD^') == 'ca9a5e7e3c94528d145a44dc6869791015b75a9d'
          assert git('rev-parse', 'HEAD:README.md') == '5e7404dbf940b95158621cd0d718a5dca98f5b37'
          evidence = pathlib.Path('.guide-evidence/candidate-qa')
          assert json.loads((evidence/'source.json').read_text())['source_commit'] == '8e25d56452c5d9292b0a33f36394906ea7b6e597'
          targets = {
              'screenshots/practice-editor-wide.png': ('docs/screenshots/pr30/practice-editor-wide.png', '626ee50977cd87bbf3a1c89d31558228355c96792aba2a672f467c863fe11ed7'),
              'screenshots/practice-panel-compact.png': ('docs/screenshots/pr30/practice-panel-compact.png', 'c08f509b8baa6baffc63ae8952493d6aabc6ca822c8d7d8206fa69be8d7fbb99'),
          }
          for source, (destination, checksum) in targets.items():
              raw = (evidence/source).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == checksum
              assert raw.startswith(b'\x89PNG\r\n\x1a\n')
              target = pathlib.Path(destination); target.parent.mkdir(parents=True, exist_ok=True)
              assert not target.exists()
              target.write_bytes(raw)
          readme = pathlib.Path('README.md')
          original = readme.read_text(encoding='utf-8')
          marker = '[本轮题集实现与验收范围](docs/qa/2026-09-19-practice-set.md)'
          assert original.count(marker) == 1
          addition = '''#### 已保存题集的整理与目标修改（未发布源码）

          在“复练与复测”中点击 **整理题集与目标**，可对已保存的完整题目上移、下移、从本任务移除，并编辑本次目标。窗口显示顺序、题名与来源；“恢复原题目与顺序”恢复打开时的题目选择，不修改原题或全局题篮。新增题目仍从题篮明确勾选，保存所选题目会替换本任务当前选题。

          **取消不保存；保存失败保留输入。** 至少保留一项题目，目标不能为空且不超过2000字。全局题篮清空后仍可整理已保存题集，但原Word/图片须保留。题目顺序或目标实质变化后，旧预览确认失效，须重新核对两版分页；旧导出文件与复测记录不删除。

          另一个窗口已保存考试分析时，本窗口提示重新打开核对，不静默覆盖。导出完成回调核对当前考试、任务及内容版本，再向最新历史追加记录，不用启动时的旧副本覆盖新复测。

          ![整理题集与目标；PR30源码8e25d56，Windows Qt合成验收，非已发布EXE](docs/screenshots/pr30/practice-editor-wide.png)

          ![紧凑复练面板；PR30源码8e25d56，Windows Qt合成验收，非已发布EXE](docs/screenshots/pr30/practice-panel-compact.png)

          本轮已完成 **142项题集/组卷/UI定向回归**及真实LibreOffice两版导出流程；它不是全仓测试或新的EXE发行。截图直接取自受测提交的CI附件，没有改名冒充发布版；本轮未进行人工逐像素审美验收。实现、保存冲突边界和证据见[题集整理与回调防护](docs/qa/2026-09-19-practice-editor.md)。

          '''
          revised = original.replace(marker, addition + marker, 1)
          assert revised.split('## 使用导航', 1)[1] == original.split('## 使用导航', 1)[1]
          readme.write_text(revised, encoding='utf-8')
          subprocess.run(['python', 'runtime/deeptutor_shchem/documentation_policy.py'], check=True)
          allowed = {'README.md'} | {destination for destination, _ in targets.values()}
          # Only these exact, hash-verified synthetic images are added from an ignored directory.
          git('add', '-f', *sorted(allowed))
          assert set(git('diff', '--cached', '--name-only').splitlines()) == allowed
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'docs: add verified practice editor usage and real Windows screenshots')
          git('push', 'origin', 'HEAD:refs/heads/' + branch)
