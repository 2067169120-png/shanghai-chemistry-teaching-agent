name: Apply reviewed complete-guide cleanup
on:
  push:
    branches: ["docs/readme-closure-cleanup"]
    paths: [".github/docs-cleanup.part*", ".github/workflows/apply-docs-cleanup.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pytest>=8,<10'
      - name: Apply ordinary docs with Actions; workflows are installed by the authorized connector
        shell: python
        run: |
          import hashlib, json, lzma, os, pathlib, re, subprocess, sys
          from urllib.parse import quote, urlsplit
          root=pathlib.Path.cwd()
          base='83750196ea1ffbdd116095175a87d5fba4e76b7c'
          branch='docs/readme-closure-cleanup'
          main_base='0fd71d35077a285920dc9b60a94ee71860d3590a'
          main_branch='docs/homepage-guide-20260918'
          repo='2067169120-png/shanghai-chemistry-teaching-agent'
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD') == os.environ['GITHUB_SHA']
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0] == os.environ['GITHUB_SHA']
          parts=['.github/docs-cleanup.part1','.github/docs-cleanup.part2']
          patch=lzma.decompress(b''.join(pathlib.Path(p).read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == 'a4d59f7a85cd6f32470d1eaaa15184af8ac1832018b81777283bfdaaacd5950f'
          allowed=['README.md','.gitignore','AGENTS.md','CHANGELOG.md','docs/releases/0.1.87-guide-header.md',
              'docs/roadmaps/audit-followup.md','docs/WORKFLOW_STATUS.md',
              'runtime/deeptutor_shchem/documentation_policy.py','runtime/deeptutor_shchem/prepare_verified_release.py',
              'staging/coordination/deeptutor_gateway/tests/test_complete_readme.py','.github/workflows/documentation.yml']
          assert set(p.decode() for p in re.findall(rb'^diff --git a/(.*?) b/',patch,re.M))==set(allowed)
          # GITHUB_TOKEN cannot create workflow files. The identical reviewed
          # workflow has already been installed through the connected API.
          assert hashlib.sha256(pathlib.Path('.github/workflows/documentation.yml').read_bytes()).hexdigest() == '032f3df6be079932003589fb5477778ba1ef8bbaa1975e2142695353e46512e4'
          args=['git','apply','--index','--exclude=.github/workflows/documentation.yml']
          subprocess.run([*args,'--check','-'],input=patch,check=True)
          subprocess.run([*args,'-'],input=patch,check=True)
          versions=['0.1.82','0.1.83','0.1.84','0.1.85','0.1.86','0.1.87','0.1.88','0.1.89','0.1.90','0.1.91',
              '0.1.93','0.1.94','0.1.95','0.1.96','0.1.97','0.1.98','0.1.99','0.1.100']
          archives=['README-'+v+'-archive.md' for v in versions]
          assert {p.name for p in root.glob('README-*-archive.md')}==set(archives)
          removed=[{'path':p,'sha256':hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()} for p in archives]
          git('rm','-f',*archives,*parts)
          assert not any(p.startswith('.github/workflows/') for p in git('diff','--cached','--name-only').splitlines())
          out=root/'docs-check';out.mkdir(exist_ok=True)
          subprocess.run([sys.executable,'runtime/deeptutor_shchem/documentation_policy.py'],check=True)
          subprocess.run([sys.executable,'-m','pytest','-q','staging/coordination/deeptutor_gateway/tests/test_complete_readme.py',
              '--junitxml='+str(out/'documentation-tests.xml')],check=True)
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','docs: unify full functional guide and closure audit; keep README history in Git')
          cleanup_sha=git('rev-parse','HEAD')
          changed=git('diff','--name-only',base,cleanup_sha).splitlines()
          assert set(changed)==set(allowed+archives+['.github/workflows/apply-docs-cleanup.yml'])
          git('push','origin','HEAD:refs/heads/'+branch)
          readme=(root/'README.md').read_text(encoding='utf-8')
          (out/'README.md').write_text(readme,encoding='utf-8')
          (out/'WORKFLOW_STATUS.md').write_bytes((root/'docs/WORKFLOW_STATUS.md').read_bytes())
          result={'base':base,'cleanup_sha':cleanup_sha,'changed_files':changed,'removed_archives':removed,
              'app_version':'0.1.101','application_runtime_unchanged':True,'old_tags_and_releases_unchanged':True,
              'main_base':main_base,'documentation_tests':12,'temporary_workflow_pending_removal':True,
              'first_attempt':'35357666415: documentation tests passed; Actions workflow-write permission rejected; no release modified'}
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          assert git('ls-remote','origin','refs/heads/main').split()[0] == main_base
          assert not git('ls-remote','origin','refs/heads/'+main_branch)
          def permalink(match):
              image,label,target=match.group(1),match.group(2),match.group(3)
              parsed=urlsplit(target)
              if parsed.scheme or parsed.netloc or not parsed.path:
                  return match.group(0)
              assert (root/parsed.path).is_file(), target
              prefix=('https://raw.githubusercontent.com/'+repo+'/v0.1.101/' if image else
                  'https://github.com/'+repo+'/blob/'+cleanup_sha+'/')
              suffix=('#'+parsed.fragment) if parsed.fragment else ''
              return (image or '')+'['+label+']('+prefix+quote(parsed.path,safe='/')+suffix+')'
          homepage=re.sub(r'(!?)\[([^\]\n]*)\]\(([^)\n]+)\)',permalink,readme)
          git('checkout','--detach',main_base)
          (root/'README.md').write_text(homepage,encoding='utf-8')
          git('add','README.md')
          assert git('diff','--cached','--name-only').splitlines()==['README.md']
          git('commit','-m','docs: show full published-version guide on homepage without merging app code [skip ci]')
          home_sha=git('rev-parse','HEAD')
          assert git('diff','--name-only',main_base,home_sha).splitlines()==['README.md']
          git('push','origin','HEAD:refs/heads/'+main_branch)
          result.update(homepage_sha=home_sha,homepage_branch=main_branch,homepage_changed_files=['README.md'])
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'homepage-README.md').write_text(homepage,encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-cleanup-check
          path: docs-check/
          retention-days: 14
          if-no-files-found: warn
