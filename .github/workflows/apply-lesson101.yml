name: Apply reviewed existing-lesson handoff
on:
  push:
    branches: ["feature/lesson-source-0.1.101"]
    paths: [".github/lesson101.part*", ".github/workflows/apply-lesson101.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact tested source and retain the complete previous guide
        shell: python
        run: |
          import hashlib,lzma,os,pathlib,subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          branch='feature/lesson-source-0.1.101'
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['GITHUB_SHA']
          parts=['.github/lesson101.part1','.github/lesson101.part2']
          patch=lzma.decompress(b''.join(pathlib.Path(p).read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest()=='c852fa0779e55510b1d3b01cc2b7d7f2b48b0eb99908b47ee1426304719e1204'
          assert b'diff --git a/.github/' not in patch
          archive=pathlib.Path('README-0.1.100-archive.md')
          assert not archive.exists()
          archive.write_bytes(pathlib.Path('README.md').read_bytes())
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          git('add','-f',str(archive))
          git('rm','-f',*parts,'.github/workflows/apply-lesson101.yml')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat(0.1.101): import existing teaching results into reviewed nodes and restore linked output bundles')
          git('push','origin','HEAD:refs/heads/'+branch)
          print('Applied exact patch:',git('rev-parse','HEAD'))
