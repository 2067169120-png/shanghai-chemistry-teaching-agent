name: Student review first visual check
on:
  push:
    branches: ["feature/student-review-desk-0.1.96"]
permissions:
  contents: read
concurrency:
  group: review-first-look-${{ github.ref }}
  cancel-in-progress: true
jobs:
  first-view:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q integrations runtime/deeptutor_shchem
      - name: Actual original-page view and independent teacher decisions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/desktop_teacher_workbench.pyw --verify-student-review first-look
      - name: Review state, unsaved inputs, image navigation and old student workflow
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q -o faulthandler_timeout=60
          staging/coordination/deeptutor_gateway/tests/test_student_review_desk_core.py
          staging/coordination/deeptutor_gateway/tests/test_student_review_desk_ui.py
          staging/coordination/deeptutor_gateway/tests/test_desktop_student_facade.py
          staging/coordination/deeptutor_gateway/tests/test_student_workflow_e2e.py
          staging/coordination/deeptutor_gateway/tests/test_desktop_student_practice.py
          --junitxml=first-look/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-review-first-look-${{ github.sha }}
          path: first-look/
          retention-days: 14
          if-no-files-found: warn
