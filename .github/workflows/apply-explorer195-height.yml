name: Apply reviewed question-card height correction
on:
  push:
    branches: ["feature/explorer-performance-0.1.95"]
    paths: [".github/explorer195-height.patch", ".github/workflows/apply-explorer195-height.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact readable patch and remove transfer files
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          branch='feature/explorer-performance-0.1.95'
          assert run('git','rev-parse','HEAD') == os.environ['GITHUB_SHA']
          assert run('git','ls-remote','origin','refs/heads/'+branch).split()[0] == os.environ['GITHUB_SHA']
          patch=pathlib.Path('.github/explorer195-height.patch').read_bytes()
          # Normalize transcription-only diff separators/context before the exact digest check.
          patch=patch.replace(b'\n diff --git ',b'\ndiff --git ')
          patch=patch.replace(b'page.next.click();settle(app,lambda:',b'page.next.click();settle(lambda:')
          assert hashlib.sha256(patch).hexdigest() == '01b421ec584a62324e3c01afc913219d6b67714b20b34cd32972112b2c28d38d'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          run('git','rm','-f','.github/explorer195-height.patch','.github/workflows/apply-explorer195-height.yml')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','commit','-m','fix(explorer): reserve readable card height after asynchronous content and keep collapse responsive')
          run('git','push','origin','HEAD:refs/heads/'+branch)
          print('Applied:',run('git','rev-parse','HEAD'))
