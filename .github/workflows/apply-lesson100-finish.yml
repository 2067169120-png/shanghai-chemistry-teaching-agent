name: Apply inspected lesson output corrections
on:
  push:
    branches: ["feature/lesson-design-0.1.100"]
    paths: [".github/lesson100-finish.patch.xz", ".github/workflows/apply-lesson100-finish.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact tested changes and discard transfer-only files
        shell: python
        run: |
          import hashlib,lzma,os,pathlib,subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          branch='feature/lesson-design-0.1.100'
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['GITHUB_SHA']
          patch=lzma.decompress(pathlib.Path('.github/lesson100-finish.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='347067e5af8f622dd7de3500530cc6039e4beeb2cef8cc236c1e42fe738fba20'
          assert b'diff --git a/.github/' not in patch
          subprocess.run(['git','apply','--check','--index','--unidiff-zero','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero','-'],input=patch,check=True)
          git('rm','-f','.github/lesson100-finish.patch.xz','.github/workflows/apply-lesson100-finish.yml')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix(lesson): select regenerated outputs, export independent copies and verify complete delivery')
          git('push','origin','HEAD:refs/heads/'+branch)
          print('Applied:',git('rev-parse','HEAD'))
