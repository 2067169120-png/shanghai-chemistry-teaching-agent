name: Scan numbering 0.1.93
on:
  push:
    branches: ["feature/scan-numbering-0.1.93"]
permissions:
  contents: read
concurrency:
  group: scan193-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Glyphs, pixel integrity and native number selection
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_chinese_typography.py staging/coordination/deeptutor_gateway/tests/test_raster_numbers.py staging/coordination/deeptutor_gateway/tests/test_scan_number_ui.py --junitxml=readiness-qa/pytest.xml
      - name: Install local pagination engine
        run: choco install libreoffice-fresh -y --no-progress
      - name: Native selection to actual student and teacher documents
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/desktop_teacher_workbench.pyw --verify-scan-numbers readiness-qa/scan
      - name: Native Windows scale probes
        run: python runtime/deeptutor_shchem/typography_ci.py readiness-qa/font-scaling
      - name: Snapshot exact integration source
        if: always()
        run: git archive --format=zip --output=integration-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan193-review-${{ github.sha }}
          path: |
            readiness-qa/
            integration-source.zip
          retention-days: 14
