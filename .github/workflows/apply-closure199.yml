name: Apply reviewed teaching-closure source
on:
  push:
    branches: ["feature/teaching-closure-0.1.99"]
    paths: [".github/closure199.part*", ".github/workflows/apply-closure199.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact reviewed source and discard transport files
        shell: python
        run: |
          import hashlib,lzma,os,pathlib,subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          branch='feature/teaching-closure-0.1.99'
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['GITHUB_SHA']
          parts=['.github/closure199.part1','.github/closure199.part2']
          patch=lzma.decompress(b''.join(pathlib.Path(p).read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest()=='b4a79b2106cf0ec0768e55aac27df1be9db3c5d657e624492aa4bf53dd87ea7a'
          assert b'diff --git a/.github/' not in patch
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          git('rm','-f',*parts,'.github/workflows/apply-closure199.yml')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat(0.1.99): connect formal batch scores, real-library practice and actual retest records')
          git('push','origin','HEAD:refs/heads/'+branch)
          print('Applied source',git('rev-parse','HEAD'))
