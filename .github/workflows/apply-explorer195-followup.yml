name: Apply reviewed question-page follow-up
on:
  push:
    branches: ["feature/explorer-performance-0.1.95"]
    paths: [".github/explorer195-followup.patch", ".github/workflows/apply-explorer195-followup.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply the exact plaintext patch and discard transfer files
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          branch='feature/explorer-performance-0.1.95'
          assert run('git','rev-parse','HEAD') == os.environ['GITHUB_SHA']
          assert run('git','ls-remote','origin','refs/heads/'+branch).split()[0] == os.environ['GITHUB_SHA']
          patch=pathlib.Path('.github/explorer195-followup.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == '9bc1ac447c6b03cc77271f4499890da1e94e24d1461f523c6abbac03177190ea'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          run('git','rm','-f','.github/explorer195-followup.patch','.github/workflows/apply-explorer195-followup.yml')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','commit','-m','fix(explorer): adapt late cards to narrow windows and isolate regression fixtures')
          run('git','push','origin','HEAD:refs/heads/'+branch)
          print('Applied:',run('git','rev-parse','HEAD'))
