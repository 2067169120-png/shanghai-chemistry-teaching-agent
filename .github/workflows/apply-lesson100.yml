name: Apply reviewed local lesson-design source
on:
  push:
    branches: ["feature/lesson-design-0.1.100"]
    paths: [".github/lesson100.part*", ".github/workflows/apply-lesson100.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify exact source patch and preserve previous full guide
        shell: python
        run: |
          import hashlib,lzma,os,pathlib,subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          branch='feature/lesson-design-0.1.100'
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['GITHUB_SHA']
          parts=['.github/lesson100.part1','.github/lesson100.part2']
          patch=lzma.decompress(b''.join(pathlib.Path(p).read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest()=='18f4a5e32214574e28670188da84b4ee9bf6a9eb017843462224bbe2811524d5'
          assert b'diff --git a/.github/' not in patch
          archive=pathlib.Path('README-0.1.99-archive.md')
          assert not archive.exists()
          archive.write_bytes(pathlib.Path('README.md').read_bytes())
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          git('add','-f',str(archive))
          git('rm','-f',*parts,'.github/workflows/apply-lesson100.yml')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat(0.1.100): edit teaching nodes, check goal coverage and export linked lesson outputs')
          git('push','origin','HEAD:refs/heads/'+branch)
          print('Applied source',git('rev-parse','HEAD'))
