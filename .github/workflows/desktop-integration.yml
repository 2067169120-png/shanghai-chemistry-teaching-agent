name: Desktop integration
on:
  push:
    branches: ["integration/desktop-closure-20260914"]
  pull_request:
    branches: ["feature/source-repairs-and-workbench", "main"]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q integrations
      - name: Run desktop regression tests
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_desktop_first_run.py staging/coordination/deeptutor_gateway/tests/test_desktop_library_progress.py staging/coordination/deeptutor_gateway/tests/test_desktop_teaching_design_contract.py staging/coordination/deeptutor_gateway/tests/test_desktop_ui.py staging/coordination/deeptutor_gateway/tests/test_desktop_preparation_provider.py staging/coordination/deeptutor_gateway/tests/test_teacher_source_prompt_rules.py --junitxml=desktop-qa/pytest.xml
      - name: Check source-bound textbook hints and original-page reading
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          staging/coordination/deeptutor_gateway/tests/test_textbook_reading_hints.py
          staging/coordination/deeptutor_gateway/tests/test_textbook_source_service.py
          staging/coordination/deeptutor_gateway/tests/test_textbook_source_ui.py
          staging/coordination/deeptutor_gateway/tests/test_textbook_section_reader.py
          staging/coordination/deeptutor_gateway/tests/test_preparation_sources.py
          --junitxml=desktop-qa/textbook-reading-hints.xml
      - name: Exercise native Windows Qt routes and capture real screenshots
        run: python runtime/deeptutor_shchem/desktop_ci_smoke.py
      - name: Check teacher workspace and local material intake in isolated processes
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: >-
          python staging/coordination/deeptutor_gateway/scripts/run_desktop_scoped_tests.py
          --output desktop-qa/teacher-workspace --version teacher-workspace.v1
          staging/coordination/deeptutor_gateway/tests/test_teacher_workspace.py
          staging/coordination/deeptutor_gateway/tests/test_textbook_workspace.py
          staging/coordination/deeptutor_gateway/tests/test_textbook_teaching_bridge.py
          staging/coordination/deeptutor_gateway/tests/test_textbook_handoff_ui.py
          staging/coordination/deeptutor_gateway/tests/test_teacher_workspace_ui.py
          staging/coordination/deeptutor_gateway/tests/test_local_material_import_cli.py
          staging/coordination/deeptutor_gateway/tests/test_complete_readme.py
      - name: Check Windows classroom, score freshness, business restore and textbook assets
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: >-
          python staging/coordination/deeptutor_gateway/scripts/run_desktop_scoped_tests.py
          --output desktop-qa/windows-gap-closure --version windows-gap-closure.v1
          staging/coordination/deeptutor_gateway/tests/test_classroom_registry.py
          staging/coordination/deeptutor_gateway/tests/test_classroom_registry_ui.py
          staging/coordination/deeptutor_gateway/tests/test_exam_mapping_profiles.py
          staging/coordination/deeptutor_gateway/tests/test_batch_exam_freshness.py
          staging/coordination/deeptutor_gateway/tests/test_business_backup.py
          staging/coordination/deeptutor_gateway/tests/test_lesson_backup_ui.py
          staging/coordination/deeptutor_gateway/tests/test_backup_reopen_ui.py
          staging/coordination/deeptutor_gateway/tests/test_textbook_assets.py
          staging/coordination/deeptutor_gateway/tests/test_textbook_assets_ui.py
          staging/coordination/deeptutor_gateway/tests/test_textbook_asset_catalog.py
          staging/coordination/deeptutor_gateway/tests/test_textbook_asset_catalog_ui.py
      - name: Check documentation links and source release boundaries
        run: python runtime/deeptutor_shchem/documentation_policy.py
      - name: Archive exact tracked source
        if: always()
        run: git archive --format=zip --output=desktop-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-${{ github.sha }}
          path: |
            desktop-qa/
            desktop-source.zip
          retention-days: 14
          if-no-files-found: error
