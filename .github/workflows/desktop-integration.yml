name: Desktop integration
on:
  push:
    branches: ["integration/desktop-closure-20260914"]
  pull_request:
    branches: ["feature/source-repairs-and-workbench", "main"]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q integrations
      - name: Run desktop regression tests
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_desktop_first_run.py staging/coordination/deeptutor_gateway/tests/test_desktop_ui.py staging/coordination/deeptutor_gateway/tests/test_desktop_preparation_provider.py staging/coordination/deeptutor_gateway/tests/test_teacher_source_prompt_rules.py --junitxml=desktop-qa/pytest.xml
      - name: Exercise native Windows Qt routes and capture real screenshots
        run: python runtime/deeptutor_shchem/desktop_ci_smoke.py
      - name: Archive exact tracked source
        if: always()
        run: git archive --format=zip --output=desktop-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-${{ github.sha }}
          path: |
            desktop-qa/
            desktop-source.zip
          retention-days: 14
          if-no-files-found: error
