name: Backup native review runtime
on:
  push:
    branches: ["feature/lesson-backup-0.1.89"]
    paths: [".github/workflows/backup-native-review.yml"]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip download --only-binary=:all: --dest wheels PySide6==6.11.2
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-qt-review-runtime
          path: wheels/
          retention-days: 1
          if-no-files-found: error
