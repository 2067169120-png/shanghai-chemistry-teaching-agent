name: Finalize full-guide status wording
on:
  push:
    branches: ["feature/lesson-design-0.1.100"]
    paths: [".github/workflows/lesson100-guide-wording.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Preserve all guide content and replace only temporary status wording
        shell: python
        run: |
          import os,pathlib,subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          branch='feature/lesson-design-0.1.100'
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['GITHUB_SHA']
          p=pathlib.Path('README.md'); text=p.read_text(encoding='utf-8')
          old='当前0.1.100为源码候选，未完成同一修订的Windows验收前，不将历史1221项结果改称本版结果。'
          new='本版数据以同一修订的Windows与独立EXE验收记录为准；不把历史1221项结果计入本版。'
          assert text.count(old)==1
          p.write_text(text.replace(old,new),encoding='utf-8')
          git('rm','-f','.github/workflows/lesson100-guide-wording.yml')
          git('add','README.md')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','docs: preserve full guide and use durable verification wording [skip ci]')
          git('push','origin','HEAD:refs/heads/'+branch)
          print(git('rev-parse','HEAD'))
