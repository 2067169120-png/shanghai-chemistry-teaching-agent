name: Stage reviewed work organization source
on:
  push:
    branches: ["feature/work-organization-0.1.88"]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply verified software delta and remove transport
        run: python .github/apply_work188.py
