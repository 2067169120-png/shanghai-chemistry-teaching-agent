name: Teaching closure first look
on:
  push:
    branches: ["feature/teaching-closure-0.1.99"]
permissions:
  contents: read
concurrency:
  group: closure199-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  first-look:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Retain the exact source under review
        run: git archive --format=zip --output=integration-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: closure199-source-${{ github.sha }}
          path: integration-source.zip
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q integrations runtime/deeptutor_shchem
      - name: Actual filtered question page and dated retest entry
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/desktop_teacher_workbench.pyw --verify-closure-lite first-look
      - name: New links and existing exam interfaces
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          staging/coordination/deeptutor_gateway/tests/test_teaching_closure.py
          staging/coordination/deeptutor_gateway/tests/test_teaching_closure_ui.py
          staging/coordination/deeptutor_gateway/tests/test_exam_dashboard_ui.py
          --junitxml=first-look/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closure199-first-look-${{ github.sha }}
          path: first-look/
          retention-days: 14
          if-no-files-found: warn
