name: Apply inspected student-review labels
on:
  push:
    branches: ["feature/student-review-desk-0.1.96"]
    paths: [".github/review196-polish.patch", ".github/workflows/apply-review196-polish.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply the exact reviewed plaintext correction
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          branch='feature/student-review-desk-0.1.96'
          assert git('rev-parse','HEAD') == os.environ['GITHUB_SHA']
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0] == os.environ['GITHUB_SHA']
          patch=pathlib.Path('.github/review196-polish.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == 'a35e97479f333e5f9663e9a79679d5d8fa4b909b4ce971974f697e730dcc8d7a'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          git('rm','-f','.github/review196-polish.patch','.github/workflows/apply-review196-polish.yml')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix(review): keep AI tab readable and align existing incomplete-evidence wording test')
          git('push','origin','HEAD:refs/heads/'+branch)
          print(git('rev-parse','HEAD'))
