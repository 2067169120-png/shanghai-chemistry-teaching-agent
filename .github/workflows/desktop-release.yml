name: Verified Windows release
on:
  push:
    branches: ["feature/desktop-onboarding-0.1.87"]
    paths: [".github/workflows/desktop-release.yml", "runtime/deeptutor_shchem/prepare_verified_release.py", "docs/releases/0.1.87.md"]
permissions:
  contents: read
concurrency:
  group: release-0.1.87
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q integrations runtime/deeptutor_shchem
      - name: Regression including actual settings and output renderer
        run: >-
          python -m pytest -q
          staging/coordination/deeptutor_gateway/tests/test_desktop_environment.py
          staging/coordination/deeptutor_gateway/tests/test_desktop_package_resources.py
          staging/coordination/deeptutor_gateway/tests/test_desktop_onboarding_ui.py
          staging/coordination/deeptutor_gateway/tests/test_desktop_ui.py
          staging/coordination/deeptutor_gateway/tests/test_desktop_provider_probe.py
          staging/coordination/deeptutor_gateway/tests/test_model_provider_settings.py
          staging/coordination/deeptutor_gateway/tests/test_phase_a_core.py
          staging/coordination/deeptutor_gateway/tests/test_phase_a_ui.py
          staging/coordination/deeptutor_gateway/tests/test_question_explorer.py
          staging/coordination/deeptutor_gateway/tests/test_question_explorer_ui.py
          staging/coordination/deeptutor_gateway/tests/test_desktop_preparation_renderer.py
          --junitxml=readiness-qa/pytest.xml
      - run: python runtime/deeptutor_shchem/package_resources.py --inventory readiness-qa/resources.json
      - run: python runtime/deeptutor_shchem/onboarding_ci_smoke.py
      - run: ./runtime/deeptutor_shchem/desktop_build.ps1 -BuildTag "release${{ github.run_id }}"
      - run: choco install libreoffice-fresh -y --no-progress
      - name: Copy and run the shipping executable without developer paths
        run: python runtime/deeptutor_shchem/verify_packaged_trial.py "runtime/deeptutor_shchem/desktop_dist_release${{ github.run_id }}/沪上化学智研台"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-${{ github.sha }}
          path: |
            readiness-qa/
            package-qa/
            release-assets/
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-verification-${{ github.sha }}
          path: .release-input
      - run: python -m pip install 'Markdown>=3.7,<4'
      - name: Record evidence, tag immutable delivery point and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python runtime/deeptutor_shchem/prepare_verified_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-0.1.87-${{ github.sha }}
          path: release-delivery/
          retention-days: 30
          if-no-files-found: warn
