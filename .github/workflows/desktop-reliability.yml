name: Desktop Reliability 0.1.86
on:
  push:
    branches: ["feature/desktop-reliability-0.1.86"]
  pull_request:
    branches: ["feature/question-explorer-0.1.85"]
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-reliability:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare exact source revision
        shell: python {0}
        run: |
          import os, subprocess, pathlib, sys
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          if pathlib.Path('.github/apply_phase_a.py').exists():
              subprocess.run([sys.executable,'.github/apply_phase_a.py'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('SHCHEM_SOURCE_SHA='+sha+'\n')
      - name: Install desktop and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q integrations runtime/deeptutor_shchem
      - name: Run existing and new reliability regression
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_desktop_first_run.py staging/coordination/deeptutor_gateway/tests/test_desktop_library_progress.py staging/coordination/deeptutor_gateway/tests/test_desktop_teaching_design_contract.py staging/coordination/deeptutor_gateway/tests/test_desktop_ui.py staging/coordination/deeptutor_gateway/tests/test_desktop_preparation_provider.py staging/coordination/deeptutor_gateway/tests/test_teacher_source_prompt_rules.py staging/coordination/deeptutor_gateway/tests/test_desktop_studio.py staging/coordination/deeptutor_gateway/tests/test_desktop_studio_ui.py staging/coordination/deeptutor_gateway/tests/test_desktop_studio_visual.py staging/coordination/deeptutor_gateway/tests/test_question_explorer.py staging/coordination/deeptutor_gateway/tests/test_question_explorer_ui.py staging/coordination/deeptutor_gateway/tests/test_word_question_filters.py staging/coordination/deeptutor_gateway/tests/test_mixed_paper_pagination.py staging/coordination/deeptutor_gateway/tests/test_desktop_mixed_paper_service.py staging/coordination/deeptutor_gateway/tests/test_phase_a_core.py staging/coordination/deeptutor_gateway/tests/test_phase_a_ui.py staging/coordination/deeptutor_gateway/tests/test_desktop_preparation_drafts.py staging/coordination/deeptutor_gateway/tests/test_preparation_draft_ui.py staging/coordination/deeptutor_gateway/tests/test_preparation_returned_recovery_backend.py staging/coordination/deeptutor_gateway/tests/test_desktop_preparation.py --junitxml=phase-a-qa/pytest.xml
      - name: Measure compiled query against baseline with equal results
        run: python runtime/deeptutor_shchem/benchmark_phase_a.py
      - name: Exercise abrupt restart, normal close and old-work search
        run: python runtime/deeptutor_shchem/phase_a_ci_smoke.py
      - name: Publish isolated screenshots and measured evidence
        if: success() && github.event_name == 'push'
        run: python runtime/deeptutor_shchem/publish_phase_a_evidence.py
      - name: Archive exact source
        if: always()
        run: |
          New-Item -ItemType Directory -Force phase-a-qa | Out-Null
          git rev-parse HEAD > phase-a-qa/source-archive-commit.txt
          git archive --format=zip --output=phase-a-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-0.1.86-${{ github.sha }}
          path: |
            phase-a-qa/
            phase-a-source.zip
          retention-days: 14
          if-no-files-found: error
