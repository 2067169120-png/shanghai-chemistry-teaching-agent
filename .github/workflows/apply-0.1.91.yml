name: Apply reviewed source 0.1.91
on:
  push:
    branches: ["feature/paper-numbering-0.1.91"]
    paths: [".github/workflows/apply-0.1.91.yml", ".github/changes-0.1.91.part*"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply reviewed source changes only; workflow is installed through the connector
        id: apply
        shell: python
        run: |
          import lzma, hashlib, os, pathlib, subprocess
          def run(*args, **kwargs):
              return subprocess.check_output(args, text=True, **kwargs).strip()
          branch = "feature/paper-numbering-0.1.91"
          subprocess.run(["git", "merge-base", "--is-ancestor", "866a380f67dd1bcad3b63d499a8f4b9e0abb89d4", "HEAD"], check=True)
          assert run("git", "ls-remote", "origin", "refs/heads/"+branch).split()[0] == os.environ["GITHUB_SHA"]
          patch = lzma.decompress(b"".join(pathlib.Path(".github/changes-0.1.91.part"+str(i)).read_bytes() for i in range(1,5)))
          assert hashlib.sha256(patch).hexdigest() == "a81ba224d6e5e8d867de894e2fbbbb6d3351dfbbe49fc10e9467743f7ff070c0"
          subprocess.run(["git", "apply", "--check", "--unidiff-zero", "--exclude=.github/workflows/paper-numbering.yml", "--index", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "--unidiff-zero", "--exclude=.github/workflows/paper-numbering.yml", "--index", "-"], input=patch, check=True)
          run("git", "rm", "-f", *[".github/changes-0.1.91.part"+str(i) for i in range(1,5)])
          run("git", "config", "user.name", "github-actions[bot]")
          run("git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          run("git", "commit", "-m", "feat(0.1.91): compose current paper numbers, clarify teacher copy and pin preparation actions")
          sha = run("git", "rev-parse", "HEAD")
          run("git", "push", "origin", "HEAD:refs/heads/"+branch)
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("sha="+sha+"\n")
