name: Apply explicit result scrolling in exam acceptance
on:
  push:
    branches: ["feature/exam-dashboard-0.1.98"]
    paths: [".github/exam198-scroll.patch", ".github/workflows/apply-exam198-scroll.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - shell: python
        run: |
          import pathlib,hashlib,os,subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          branch='feature/exam-dashboard-0.1.98'
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['GITHUB_SHA']
          patch=pathlib.Path('.github/exam198-scroll.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='37daf96972875e8308788c2c95df6ce291d7db4a9ddfcbd869d45f5b082defbf'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          git('rm','-f','.github/exam198-scroll.patch','.github/workflows/apply-exam198-scroll.yml')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','test(exam): scroll to result as a teacher would before asserting reading area')
          git('push','origin','HEAD:refs/heads/'+branch)
          print(git('rev-parse','HEAD'))
