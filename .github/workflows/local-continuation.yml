name: Home dashboard and local import continuation
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: local-continuation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check dashboard, review workflow and local continuation with synthetic data
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_home_dashboard_ui.py staging/coordination/deeptutor_gateway/tests/test_local_import_continuation.py staging/coordination/deeptutor_gateway/tests/test_maintenance_release_safety.py staging/coordination/deeptutor_gateway/tests/test_desktop_library_progress.py staging/coordination/deeptutor_gateway/tests/test_library_progress_dialog.py staging/coordination/deeptutor_gateway/tests/test_offline_word_label_review.py staging/coordination/deeptutor_gateway/tests/test_word_missing_attribute_merge.py staging/coordination/deeptutor_gateway/tests/test_word_semantic_tags.py staging/coordination/deeptutor_gateway/tests/test_extend_lecture_knowledge.py --junitxml=local-continuation-qa/pytest.xml
      - name: Check visual repair navigation and source boundaries with synthetic data
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_library_progress_visual.py staging/coordination/deeptutor_gateway/tests/test_personal_visual_questions.py staging/coordination/deeptutor_gateway/tests/test_personal_visual_questions_ui.py staging/coordination/deeptutor_gateway/tests/test_personal_visual_attributes_ui.py staging/coordination/deeptutor_gateway/tests/test_word_question_index.py staging/coordination/deeptutor_gateway/tests/test_word_question_attribute_service.py staging/coordination/deeptutor_gateway/tests/test_word_questions_service.py staging/coordination/deeptutor_gateway/tests/test_lecture_library.py staging/coordination/deeptutor_gateway/tests/test_lecture_study_reference.py --junitxml=local-continuation-qa/visual-boundaries.xml
      - name: Capture the native dashboard in temporary synthetic storage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/home_dashboard_qa.py --output local-continuation-qa/screenshots
      - name: Check explicit range label review and native editor
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_word_range_label_reconfirmation.py staging/coordination/deeptutor_gateway/tests/test_word_question_dialog.py --junitxml=local-continuation-qa/range-review.xml
      - name: Capture explicit range review with synthetic labels
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/range_label_review_qa.py --output local-continuation-qa/range-labels
      - name: Check source page navigation and crop transactions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_personal_visual_crop_review_ui.py staging/coordination/deeptutor_gateway/tests/test_personal_visual_crops_ui.py staging/coordination/deeptutor_gateway/tests/test_personal_visual_crops.py --junitxml=local-continuation-qa/crop-review.xml
      - name: Capture source and crop review with synthetic pages
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/source_crop_review_qa.py --output local-continuation-qa/source-crops
      - name: Capture the native review list in temporary synthetic storage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/library_progress_qa.py --output local-continuation-qa/review-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-continuation-${{ github.sha }}
          path: local-continuation-qa/
          if-no-files-found: error
          retention-days: 14
