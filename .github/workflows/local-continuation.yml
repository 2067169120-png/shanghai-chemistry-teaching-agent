name: Home dashboard and local import continuation
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: local-continuation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check dashboard and read-only continuation with synthetic data
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_home_dashboard_ui.py staging/coordination/deeptutor_gateway/tests/test_local_import_continuation.py staging/coordination/deeptutor_gateway/tests/test_maintenance_release_safety.py --junitxml=local-continuation-qa/pytest.xml
      - name: Capture the native dashboard in temporary synthetic storage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/home_dashboard_qa.py --output local-continuation-qa/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-continuation-${{ github.sha }}
          path: local-continuation-qa/
          if-no-files-found: error
          retention-days: 14
