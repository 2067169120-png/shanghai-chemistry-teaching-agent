name: Independent practice source and real Office checks
on:
  push:
    branches: ["feature/lesson-source-0.1.101"]
    paths: ["integrations/**", "runtime/deeptutor_shchem/exam_practice_ci.py", "staging/coordination/deeptutor_gateway/tests/**", ".github/workflows/exam-practice.yml"]
  pull_request:
    branches: ["feature/lesson-source-0.1.101"]
permissions:
  contents: read
concurrency:
  group: exam-practice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile and check the complete guide
        run: |
          python -m compileall -q integrations runtime/deeptutor_shchem
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python runtime/deeptutor_shchem/documentation_policy.py
          exit $LASTEXITCODE
      - name: Task isolation, old paper engine, UI and release safety
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
          SHCHEM_CANDIDATE_SCREENSHOTS: candidate-qa/screenshots
        run: |
          import json, pathlib, subprocess, sys
          files = ['test_exam_practice_set.py', 'test_exam_practice_set_ui.py',
              'test_practice_editor_core.py', 'test_practice_editor_ui.py',
              'test_desktop_mixed_paper_service.py', 'test_teaching_closure.py',
              'test_teaching_closure_ui.py', 'test_complete_readme.py',
              'test_maintenance_release_safety.py']
          out = pathlib.Path('candidate-qa'); out.mkdir(exist_ok=True)
          (out/'source.json').write_text(json.dumps({
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'scope': 'Windows source and real Office, synthetic data, no new EXE or Release',
              'test_files': files,
          }, indent=2), encoding='utf-8')
          subprocess.run([sys.executable, '-m', 'pytest', '-q',
              *['staging/coordination/deeptutor_gateway/tests/'+f for f in files],
              '--junitxml=candidate-qa/pytest.xml'], check=True)
      - name: Install real pagination converter
        run: choco install libreoffice-fresh -y --no-progress
      - name: Save, edit, remove from basket, reopen, paginate and export
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/exam_practice_ci.py candidate-qa/practice-office
      - name: Evidence summary and exact source patch
        if: always()
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess
          import xml.etree.ElementTree as ET
          out = pathlib.Path('candidate-qa'); out.mkdir(exist_ok=True)
          report = out/'pytest.xml'
          if report.exists():
              suites = ET.parse(report).getroot().iter('testsuite')
              print('JUNIT_SUMMARY', json.dumps([node.attrib for node in suites]))
          source = out/'source.json'
          if source.exists(): print('TESTED_SOURCE', source.read_text(encoding='utf-8'))
          acceptance = out/'practice-office'/'acceptance.json'
          if acceptance.exists(): print('OFFICE_ACCEPTANCE', acceptance.read_text(encoding='utf-8'))
          base = '749e9a04f3fa8a8b6b29cdea1a41b11d3b83e746'
          patch = subprocess.check_output(['git', 'diff', '--binary', base, 'HEAD', '--'])
          (out/'pr30.patch').write_bytes(patch)
          inventory = {str(path.relative_to(out)).replace('\\','/'): hashlib.sha256(path.read_bytes()).hexdigest()
                       for path in out.rglob('*') if path.is_file() and path.name != 'sha256.json'}
          (out/'sha256.json').write_text(json.dumps(inventory, indent=2), encoding='utf-8')
          print('EVIDENCE_INVENTORY', json.dumps(inventory))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exam-practice-${{ github.run_id }}
          path: |
            candidate-qa/
            README.md
            docs/qa/2026-09-19-practice-set.md
            docs/qa/2026-09-19-practice-editor.md
          if-no-files-found: error
          retention-days: 14
