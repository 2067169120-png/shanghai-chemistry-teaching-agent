name: Refine reviewed revision scope once
on:
  push:
    branches: ["maintenance/exam-revisions-20260919"]
    paths: [".github/workflows/refine-exam-revision-once.yml"]
permissions:
  contents: read
jobs:
  refine:
    if: github.repository == '2067169120-png/shanghai-chemistry-teaching-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Refine only the reviewed code, tests and scope note
        shell: python
        run: |
          import os,pathlib,subprocess
          branch='maintenance/exam-revisions-20260919'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='10e9a130427a4c597039a083d3447e8ca5b76b22'
          core='integrations/deeptutor_shchem_v1/desktop_exam_revision.py'
          ui='integrations/deeptutor_shchem_v1/desktop_workbench/exam_revision_ui.py'
          ct='staging/coordination/deeptutor_gateway/tests/test_exam_revision_core.py'
          ut='staging/coordination/deeptutor_gateway/tests/test_exam_revision_ui.py'
          doc='docs/qa/2026-09-19-score-revisions.md'
          allowed={core,ui,ct,ut,doc}
          data={name:pathlib.Path(name).read_text(encoding='utf-8') for name in allowed}
          def replace(name,before,after):
              assert data[name].count(before)==1,(name,before)
              data[name]=data[name].replace(before,after,1)
          replace(core,"                   'notes': notes, 'scope': scope})",
              "                   'notes': notes, 'scope': scope,\n                   'issues': exam.get('issues', []), 'warnings': exam.get('warnings', [])})")
          replace(ui,'        self.student_table.parentWidget().layout().insertWidget(1,self.score_tools)',
              '        self.score_tools.setEnabled(bool(self.exam) and not bool(self._task))\n        self.student_table.parentWidget().layout().insertWidget(1,self.score_tools)')
          replace(ui,"        stale = sum(task_freshness(self.exam,task)['state']!='current' for task in self.followups)",
              "        allowed = {row['id'] for row in self.report['students']} if self.report else set()\n        relevant = [task for task in self.followups if any(\n            target.get('exam_student_id') in allowed for target in task.get('targets', []))]\n        stale = sum(task_freshness(self.exam,task)['state']!='current' for task in relevant)")
          replace(ui,"        if not isinstance(history,list):raise ExamError('旧建议历史格式异常，请保留文件，不覆盖该记录。')",
              "        if not isinstance(history,list) or any(not isinstance(item,dict) or 'result' not in item for item in history):\n            raise ExamError('旧建议历史格式异常，请保留文件，不覆盖该记录。')")
          data[ct]+='''

          def test_advice_versions_include_diagnostics(exam):
              original=advice_revision(exam,{},'',None)
              copy=deepcopy(exam);copy['warnings'].append('新核对提醒')
              assert advice_revision(copy,{},'',None)!=original
              copy=deepcopy(exam);copy['issues'].append({'row':2,'field':'总分','detail':'新异常'})
              assert advice_revision(copy,{},'',None)!=original
          '''
          data[ut]+='''

          def test_pending_task_count_respects_current_class(desk):
              d,app,_=desk;seed(d);d.apply_score_change('S0001','1',0,'核对录入')
              owner=d.exam['students'][0]['class']
              other=next(row['class'] for row in d.exam['students'] if row['class']!=owner)
              d.classes.setCurrentIndex(d.classes.findData(other));settle(app)
              assert '0项复练依据待核对' in d.freshness_text()
              d.classes.setCurrentIndex(d.classes.findData(owner));settle(app)
              assert '1项复练依据待核对' in d.freshness_text()


          def test_invalid_advice_history_rejected_before_loading_over_current_work(desk):
              d,app,_=desk;seed(d);original=deepcopy(d.exam)
              bundle=d.bundle();bundle['advice_history']=['损坏的历史']
              d.store.save(bundle,expected_revision=d._saved_revision)
              with pytest.raises(ExamError):d.open_saved(d.exam['id'])
              assert d.exam==original and d.store.load(d.exam['id'])==bundle
          '''
          data[doc]+='\n## 补充复核\n\n班级筛选后的待核对数量只统计当前范围内的任务，不混入其他班级。AI版本同时绑定数据异常与警告，避免数字不变但核对依据变化后误用旧建议。旧建议历史格式损坏时在载入前停止，不覆盖当前窗口和原文件；新增对应反例。\n'
          for name,content in data.items():pathlib.Path(name).write_text(content,encoding='utf-8')
          subprocess.run(['python','-m','compileall','-q','integrations','runtime/deeptutor_shchem','staging/coordination/deeptutor_gateway/tests'],check=True)
          subprocess.run(['python','runtime/deeptutor_shchem/documentation_policy.py'],check=True)
          git('diff','--check');git('add',*sorted(allowed))
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix: scope stale-task counts and bind advice diagnostics without losing history')
          git('push','origin','HEAD:refs/heads/'+branch)
