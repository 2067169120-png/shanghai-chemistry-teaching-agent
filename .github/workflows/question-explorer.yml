name: Question Explorer 0.1.85
on:
  push:
    branches: ["feature/question-explorer-0.1.85"]
  pull_request:
    branches: ["feature/desktop-studio-0.1.84"]
permissions:
  contents: read
concurrency:
  group: explorer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-explorer:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record tested source revision
        shell: python {0}
        run: |
          import os, subprocess
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          sha = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write('SHCHEM_SOURCE_SHA=' + sha + '\n')
      - name: Install desktop and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q integrations runtime/deeptutor_shchem
      - name: Run selection, basket, pagination and existing desktop regression
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_desktop_first_run.py staging/coordination/deeptutor_gateway/tests/test_desktop_library_progress.py staging/coordination/deeptutor_gateway/tests/test_desktop_teaching_design_contract.py staging/coordination/deeptutor_gateway/tests/test_desktop_ui.py staging/coordination/deeptutor_gateway/tests/test_desktop_preparation_provider.py staging/coordination/deeptutor_gateway/tests/test_teacher_source_prompt_rules.py staging/coordination/deeptutor_gateway/tests/test_desktop_studio.py staging/coordination/deeptutor_gateway/tests/test_desktop_studio_ui.py staging/coordination/deeptutor_gateway/tests/test_desktop_studio_visual.py staging/coordination/deeptutor_gateway/tests/test_question_explorer.py staging/coordination/deeptutor_gateway/tests/test_question_explorer_ui.py staging/coordination/deeptutor_gateway/tests/test_word_question_filters.py staging/coordination/deeptutor_gateway/tests/test_mixed_paper_pagination.py staging/coordination/deeptutor_gateway/tests/test_desktop_mixed_paper_service.py --junitxml=explorer-qa/pytest.xml
      - name: Install Office renderer for actual PDF preview
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles\LibreOffice\program\soffice.exe")) {
            choco install libreoffice-fresh -y --no-progress --limit-output --execution-timeout=600
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }
          }
          exit 0
      - name: Exercise saved labels, question basket and real document preview
        run: python runtime/deeptutor_shchem/explorer_ci_smoke.py
      - name: Publish verified isolated screenshots
        if: success() && github.event_name == 'push'
        run: |
          python runtime/deeptutor_shchem/publish_explorer_screenshots.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:feature/question-explorer-0.1.85
      - name: Archive exact source and evidence
        if: always()
        run: |
          New-Item -ItemType Directory -Force explorer-qa | Out-Null
          git rev-parse HEAD > explorer-qa/source-archive-commit.txt
          git archive --format=zip --output=explorer-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-0.1.85-${{ github.sha }}
          path: |
            explorer-qa/
            explorer-source.zip
          retention-days: 14
          if-no-files-found: error
