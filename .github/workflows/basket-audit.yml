name: Desktop basket and state candidate checks
on:
  workflow_call:
    inputs:
      verified_ref:
        required: true
        type: string
  push:
    branches: ["feature/lesson-source-0.1.101"]
  pull_request:
    branches: ["feature/lesson-source-0.1.101"]
permissions:
  contents: read
concurrency:
  group: basket-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.verified_ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve exact reviewed source
        run: git archive --format=zip --output=reviewed-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source-${{ github.run_id }}
          path: reviewed-source.zip
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile application and check the complete current guide
        run: |
          python -m compileall -q integrations runtime/deeptutor_shchem
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python runtime/deeptutor_shchem/documentation_policy.py
          exit $LASTEXITCODE
      - name: Isolated core, native basket and existing selection regressions
        env:
          QT_QPA_PLATFORM: offscreen
          SHCHEM_CANDIDATE_SCREENSHOTS: candidate-qa/screenshots
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          names = [
              'test_question_explorer.py', 'test_question_explorer_ui.py',
              'test_lesson_import.py', 'test_lesson_design.py',
              'test_lesson_output_backup.py', 'test_lesson_backup.py',
              'test_backup_paths.py', 'test_exam_analysis.py',
              'test_teaching_closure.py', 'test_work_batches.py',
              'test_desktop_state_corruption.py', 'test_explorer_basket_recovery_ui.py',
              'test_complete_readme.py', 'test_maintenance_release_safety.py',
          ]
          out = pathlib.Path('candidate-qa'); out.mkdir(exist_ok=True)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (out/'source.json').write_text(json.dumps({
              'source_commit': sha, 'scope': 'Windows source, no new EXE or Release',
              'network_model_calls': 0, 'synthetic_data_only': True, 'test_files': names,
          }, indent=2), encoding='utf-8')
          files = ['staging/coordination/deeptutor_gateway/tests/'+name for name in names]
          subprocess.run([sys.executable, '-m', 'pytest', '-q', *files,
              '--junitxml=candidate-qa/pytest.xml'], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basket-audit-${{ github.run_id }}
          path: |
            candidate-qa/
            README.md
            docs/qa/2026-09-19-pr26-audit.md
          if-no-files-found: error
          retention-days: 14
