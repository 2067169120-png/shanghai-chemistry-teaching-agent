name: Lesson design and linked outputs
on:
  push:
    branches: ["feature/lesson-design-0.1.100"]
permissions:
  contents: read
concurrency:
  group: lesson100-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q integrations runtime/deeptutor_shchem
      - name: Nodes, goal coverage, source locks, original drafts and complete guide
        run: >-
          python -m pytest -q -o faulthandler_timeout=120
          staging/coordination/deeptutor_gateway/tests/test_lesson_design.py
          staging/coordination/deeptutor_gateway/tests/test_lesson_design_ui.py
          staging/coordination/deeptutor_gateway/tests/test_desktop_preparation.py
          staging/coordination/deeptutor_gateway/tests/test_desktop_preparation_drafts.py
          staging/coordination/deeptutor_gateway/tests/test_complete_readme.py
          --junitxml=readiness-qa/pytest.xml
      - run: choco install libreoffice-fresh -y --no-progress
      - name: Actual editor, save-reopen, linked files and real PPTX rendering
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/desktop_teacher_workbench.pyw --verify-lesson-design readiness-qa/lesson-design
      - name: Preserve exact tested source
        if: always()
        run: git archive --format=zip --output=integration-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson100-first-${{ github.sha }}
          path: |
            readiness-qa/
            integration-source.zip
          retention-days: 14
          if-no-files-found: error
