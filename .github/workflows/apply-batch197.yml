name: Apply reviewed work-batch source
on:
  push:
    branches: ["feature/work-batches-0.1.97"]
    paths: [".github/batch197.part*", ".github/workflows/apply-batch197.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact reviewed source and remove transfer-only files
        shell: python
        run: |
          import hashlib, lzma, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          branch='feature/work-batches-0.1.97'
          assert git('rev-parse','HEAD') == os.environ['GITHUB_SHA']
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0] == os.environ['GITHUB_SHA']
          subprocess.run(['git','merge-base','--is-ancestor','766feb55ceba67ab416038a3b8f735e791d75198','HEAD'],check=True)
          parts=['.github/batch197.part'+str(i) for i in range(1,5)]
          patch=lzma.decompress(b''.join(pathlib.Path(p).read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == '5aa6d050a9b591015b50975ad2313054075a782b5b48cdd63a17685a3304a212'
          assert b'diff --git a/.github/workflows/' not in patch
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          git('rm','-f',*parts,'.github/workflows/apply-batch197.yml')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat(0.1.97): manage teacher-selected work batches and preserve independent review inputs')
          git('push','origin','HEAD:refs/heads/'+branch)
          print('Applied source:',git('rev-parse','HEAD'))
