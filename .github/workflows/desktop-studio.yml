name: Desktop Studio 0.1.84
on:
  push:
    branches: ["feature/desktop-studio-0.1.84"]
  pull_request:
    branches: ["integration/desktop-closure-20260914"]
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-studio:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check source syntax
        run: python -m compileall -q integrations
      - name: Run native regression and studio tests
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_desktop_first_run.py staging/coordination/deeptutor_gateway/tests/test_desktop_library_progress.py staging/coordination/deeptutor_gateway/tests/test_desktop_teaching_design_contract.py staging/coordination/deeptutor_gateway/tests/test_desktop_ui.py staging/coordination/deeptutor_gateway/tests/test_desktop_preparation_provider.py staging/coordination/deeptutor_gateway/tests/test_teacher_source_prompt_rules.py staging/coordination/deeptutor_gateway/tests/test_desktop_studio.py staging/coordination/deeptutor_gateway/tests/test_desktop_studio_ui.py --junitxml=studio-qa/pytest.xml
      - name: Exercise all native pages and offline classroom workflows
        run: python runtime/deeptutor_shchem/studio_ci_smoke.py
      - name: Archive tracked source
        if: always()
        run: git archive --format=zip --output=studio-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-0.1.84-${{ github.sha }}
          path: |
            studio-qa/
            studio-source.zip
          retention-days: 14
          if-no-files-found: error
