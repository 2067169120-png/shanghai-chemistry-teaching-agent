name: Score revisions and downstream evidence checks
on:
  pull_request:
    branches: ["feature/lesson-source-0.1.101"]
  push:
    branches: ["feature/lesson-source-0.1.101"]
    paths: ["integrations/**", "runtime/deeptutor_shchem/exam_revision_ci.py", "staging/coordination/deeptutor_gateway/tests/**", ".github/workflows/exam-revision.yml"]
permissions:
  contents: read
concurrency:
  group: exam-revision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile and retain source evidence
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          out = pathlib.Path('revision-qa'); out.mkdir(exist_ok=True)
          files = ['test_exam_revision_core.py', 'test_exam_revision_ui.py',
              'test_exam_dashboard_ui.py', 'test_exam_analysis.py',
              'test_exam_practice_set.py', 'test_practice_editor_ui.py',
              'test_teaching_closure.py', 'test_teaching_closure_ui.py',
              'test_complete_readme.py', 'test_maintenance_release_safety.py']
          sha = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          (out/'source.json').write_text(json.dumps({'source_commit':sha,'test_files':files,
              'scope':'Windows source, synthetic data, no new Release or EXE'},indent=2),encoding='utf-8')
          subprocess.run([sys.executable,'-m','compileall','-q','integrations','runtime/deeptutor_shchem'],check=True)
          subprocess.run([sys.executable,'runtime/deeptutor_shchem/documentation_policy.py'],check=True)
      - name: Score, stale advice, task review and existing regression tests
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
          SHCHEM_CANDIDATE_SCREENSHOTS: revision-qa/screenshots
        run: |
          import json,pathlib,subprocess,sys
          files=json.loads(pathlib.Path('revision-qa/source.json').read_text())['test_files']
          subprocess.run([sys.executable,'-m','pytest','-q',
              *['staging/coordination/deeptutor_gateway/tests/'+name for name in files],
              '--junitxml=revision-qa/pytest.xml'],check=True)
      - name: Install actual Office conversion engine
        run: choco install libreoffice-fresh -y --no-progress
      - name: Correct score, reopen, explicitly review and export again
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/exam_revision_ci.py revision-qa/office
      - name: Evidence summary and reviewable net patch
        if: always()
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,xml.etree.ElementTree as ET
          out=pathlib.Path('revision-qa');out.mkdir(exist_ok=True)
          for name in ('source.json','office/acceptance.json'):
              path=out/name
              if path.exists():print(name,path.read_text(encoding='utf-8'))
          report=out/'pytest.xml'
          if report.exists():print('JUNIT',json.dumps([x.attrib for x in ET.parse(report).getroot().iter('testsuite')]))
          patch=subprocess.check_output(['git','diff','--binary','2a061bca4852e285fad411895e9702c2ae82d3af','HEAD','--'])
          (out/'exam-revision.patch').write_bytes(patch)
          inventory={str(p.relative_to(out)).replace('\\','/'):hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in out.rglob('*') if p.is_file() and p.name!='sha256.json'}
          (out/'sha256.json').write_text(json.dumps(inventory,indent=2),encoding='utf-8')
          print('EVIDENCE_SHA256',json.dumps(inventory))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exam-revision-${{ github.run_id }}
          path: |
            revision-qa/
            README.md
            docs/qa/2026-09-19-score-revisions.md
          if-no-files-found: error
          retention-days: 14
