name: Question page first visual check
on:
  push:
    branches: ["feature/explorer-performance-0.1.95"]
permissions:
  contents: read
concurrency:
  group: explorer-first-look-${{ github.ref }}
  cancel-in-progress: true
jobs:
  first-view:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Exercise readable card contents and capture actual window
        env:
          QT_QPA_PLATFORM: offscreen
        run: python runtime/deeptutor_shchem/desktop_teacher_workbench.pyw --verify-explorer first-look
      - name: Check late layout, collapse, source refresh and original content
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_explorer_speed_ui.py staging/coordination/deeptutor_gateway/tests/test_question_explorer_ui.py --junitxml=first-look/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-first-look-${{ github.sha }}
          path: first-look/
          retention-days: 14
          if-no-files-found: warn
