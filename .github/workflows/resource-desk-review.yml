name: Resource workspace review
on:
  push:
    branches: ["feature/resource-desk-review"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resource-desk-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture exact tracked source
        run: |
          mkdir -p review-input
          git archive --format=zip --output=review-input/source.zip HEAD
          git rev-parse HEAD > review-input/SOURCE_COMMIT.txt
      - name: Download public offline review tools (not application assets)
        run: >-
          python -m pip download --only-binary=:all: --dest review-input/wheels
          'PySide6==6.11.2' 'bandit==1.8.6' 'ruff==0.12.12'
      - name: Check unique complete guide
        run: |
          python -m pip install 'pytest>=8,<10'
          python runtime/deeptutor_shchem/documentation_policy.py
          python -m pytest -q staging/coordination/deeptutor_gateway/tests/test_complete_readme.py --junitxml=review-input/documentation-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-review-input-${{ github.sha }}
          path: review-input/
          retention-days: 7
