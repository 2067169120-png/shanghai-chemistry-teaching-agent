name: Apply reviewed student review workspace
on:
  push:
    branches: ["feature/student-review-desk-0.1.96"]
    paths: [".github/review196.part*", ".github/workflows/apply-review196.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact source patch and discard transfer files
        shell: python
        run: |
          import hashlib, lzma, os, pathlib, subprocess
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          branch='feature/student-review-desk-0.1.96'
          assert run('git','rev-parse','HEAD') == os.environ['GITHUB_SHA']
          assert run('git','ls-remote','origin','refs/heads/'+branch).split()[0] == os.environ['GITHUB_SHA']
          paths=['.github/review196.part'+str(i) for i in (1,2,3)]
          patch=lzma.decompress(b''.join(pathlib.Path(p).read_bytes() for p in paths))
          assert hashlib.sha256(patch).hexdigest() == '739f4ae5687bef3253828ffaf26fc5b8e2c8c21dfcf04c2aed2eb5b67ef5da85'
          assert b'diff --git a/.github/workflows/' not in patch
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          run('git','rm','-f',*paths,'.github/workflows/apply-review196.yml')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','commit','-m','feat(0.1.96): original student pages and teacher scoring in one native workspace')
          run('git','push','origin','HEAD:refs/heads/'+branch)
          print('Applied source:',run('git','rev-parse','HEAD'))
