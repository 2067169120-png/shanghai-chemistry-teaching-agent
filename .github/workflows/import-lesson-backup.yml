name: Integrate tested lesson backup
on:
  push:
    branches: ["feature/lesson-backup-0.1.89"]
    paths: [".github/import_backup189.py", ".github/backup189-*.bin", ".github/workflows/import-lesson-backup.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact local patch on the recorded baseline and remove transfer files
        run: python .github/import_backup189.py
