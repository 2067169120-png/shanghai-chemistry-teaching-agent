        upstream_stage: { $ref: "#/components/schemas/MaterialIntakeUpstreamStage" }
        status: { $ref: "#/components/schemas/MaterialIntakeRecordStatus" }
        status_zh: { type: string, enum: [已登记待处理, 处理中, 待人工复核, 有阻断, 可浏览] }
        error_code:
          oneOf:
            - { $ref: "#/components/schemas/MaterialIntakeErrorCode" }
            - { type: "null" }
        progress: { $ref: "#/components/schemas/MaterialIntakeProgress" }
        blockers:
          type: array
          maxItems: 30
          uniqueItems: true
          items: { $ref: "#/components/schemas/MaterialIntakeBlocker" }
        next_action_zh: { type: string, minLength: 1, maxLength: 500 }
        facts:
          oneOf:
            - { $ref: "#/components/schemas/MaterialIntakeCatalogFacts" }
            - { $ref: "#/components/schemas/MaterialIntakePaperFacts" }
            - { $ref: "#/components/schemas/MaterialIntakeTeachingPackageFacts" }
            - { $ref: "#/components/schemas/MaterialIntakeTeachingDocumentFacts" }
        authority_gates: { $ref: "#/components/schemas/MaterialIntakeAuthorityGates" }
      allOf:
        - if: { properties: { record_kind: { const: catalog_source } }, required: [record_kind] }
          then:
            properties:
              record_id: { type: string, pattern: '^INTAKE-SOURCE-[0-9a-f]{24}$' }
              source_id: { type: string, pattern: '^file-[0-9a-f]{64}$' }
              parent_record_id: { type: "null" }
              facts: { $ref: "#/components/schemas/MaterialIntakeCatalogFacts" }
        - if: { properties: { record_kind: { const: paper_processing_view } }, required: [record_kind] }
          then:
            properties:
              record_id: { type: string, pattern: '^INTAKE-PAPER-PL-[0-9a-f]{16}$' }
              source_id: { type: string, pattern: '^file-[0-9a-f]{64}$' }
              parent_record_id: { type: string, pattern: '^INTAKE-SOURCE-[0-9a-f]{24}$' }
              facts: { $ref: "#/components/schemas/MaterialIntakePaperFacts" }
        - if: { properties: { record_kind: { const: teaching_package } }, required: [record_kind] }
          then:
            properties:
              record_id: { type: string, pattern: '^INTAKE-PACKAGE-PKG-[0-9]{3}$' }
              source_id: { type: string, pattern: '^PKG-[0-9]{3}$' }
              parent_record_id: { type: "null" }
              facts: { $ref: "#/components/schemas/MaterialIntakeTeachingPackageFacts" }
        - if: { properties: { record_kind: { const: teaching_document } }, required: [record_kind] }
          then:
            properties:
              record_id: { type: string, pattern: '^INTAKE-DOCUMENT-PKG-[0-9]{3}-(?:QUESTION|SOLUTION)$' }
              source_id: { type: string, pattern: '^PKG-[0-9]{3}:(?:原卷版|解析版)$' }
              parent_record_id: { type: string, pattern: '^INTAKE-PACKAGE-PKG-[0-9]{3}$' }
              facts: { $ref: "#/components/schemas/MaterialIntakeTeachingDocumentFacts" }
