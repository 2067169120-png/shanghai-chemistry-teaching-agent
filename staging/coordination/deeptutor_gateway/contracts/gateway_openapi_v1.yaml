        severity: { type: string, enum: [info, warning, error] }
        blocks:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9_]{2,99}$' }
        message_zh: { type: string, minLength: 1, maxLength: 300 }
    WorkbenchReadinessData:
