        closure_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        artifact_count: { type: integer, minimum: 1, maximum: 20000 }
        total_bytes: { type: integer, minimum: 1, maximum: 2147483648 }
