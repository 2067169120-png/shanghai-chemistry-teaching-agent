      required: [information_transformations, reasoning_chain_steps, knowledge_module_span, representation_switches, calculation_load, experiment_load, openness, unfamiliarity, language_load, dependency_on_prior_parts]
      properties:
        information_transformations: { $ref: "#/components/schemas/TagPatchFactorValue" }
        reasoning_chain_steps: { $ref: "#/components/schemas/TagPatchFactorValue" }
        knowledge_module_span: { $ref: "#/components/schemas/TagPatchFactorValue" }
        representation_switches: { $ref: "#/components/schemas/TagPatchFactorValue" }
        calculation_load: { $ref: "#/components/schemas/TagPatchFactorValue" }
        experiment_load: { $ref: "#/components/schemas/TagPatchFactorValue" }
        openness: { $ref: "#/components/schemas/TagPatchFactorValue" }
        unfamiliarity: { $ref: "#/components/schemas/TagPatchFactorValue" }
        language_load: { $ref: "#/components/schemas/TagPatchFactorValue" }
        dependency_on_prior_parts: { $ref: "#/components/schemas/TagPatchFactorValue" }
    TagPatchFactorUpdates:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        item_type: { type: string, enum: [embedded_single_choice, embedded_multiple_choice, embedded_indeterminate_choice, short_fill, chemical_equation_or_notation, organic_structure_or_route, quantitative_calculation, reasoned_explanation, graph_read_draw_complete, experiment_operation_apparatus_plan, process_flow_condition_choice, comparison_or_open_response] }
        selection_rule: { type: string, enum: [single, multiple, indeterminate, not_applicable, unknown] }
        primary_knowledge_K: { type: string, pattern: '^K[0-9][A-Za-z0-9_.-]*$' }
        supporting_knowledge_K: { type: array, maxItems: 128, uniqueItems: true, items: { type: string, pattern: '^K[0-9][A-Za-z0-9_.-]*$' } }
        ability_A: { type: array, minItems: 1, maxItems: 128, uniqueItems: true, items: { type: string, pattern: '^A[0-9][A-Za-z0-9_.-]*$' } }
        context_C: { type: array, minItems: 1, maxItems: 128, uniqueItems: true, items: { type: string, pattern: '^C[0-9][A-Za-z0-9_.-]*$' } }
        response_R: { type: string, pattern: '^R(?!P)[0-9][A-Za-z0-9_.-]*$' }
        representation_RP: { type: array, minItems: 1, maxItems: 128, uniqueItems: true, items: { type: string, pattern: '^RP[0-9][A-Za-z0-9_.-]*$' } }
        cognitive_prelabel: { type: [string, "null"], enum: [D1, D2, D3, D4, D5, null] }
        difficulty_factors: { $ref: "#/components/schemas/TagPatchDifficultyFactors" }
    TagPatchBrowserRequest:
      type: object
      additionalProperties: false
      required: [node_type, node_id, factor_updates, reason, expected_current_public_node_identity]
      properties:
        node_type: { const: atomic_part }
        node_id: { $ref: "#/components/schemas/OpaqueWorkbenchId" }
        factor_updates: { $ref: "#/components/schemas/TagPatchFactorUpdates" }
