    ThemeReviewTaskProjectionBase:
      type: object
      description: Strict path-free common projection. The source generation is constrained by ThemeReviewTaskProjectionV1 or ThemeReviewTaskProjectionV2.
      additionalProperties: false
      required: [schema_version, task_id, task_kind, unit_kind, priority, paper_id, theme_id, candidate_theme_id, title_zh, status, revision, assignee, boundary_mode, candidate_basis_zh, source_binding, source_binding_candidates, base_snapshot_sha256, task_input_sha256, target_counts, state, allowed_actions, base, gap_counts, write_capabilities, authority]
      properties:
        schema_version: { const: shchem_gateway_theme_review_v2 }
        task_id: { $ref: "#/components/schemas/OpaqueWorkbenchId" }
        task_kind: { type: string, enum: [theme_big_question, paper_theme_boundary_review] }
        unit_kind: { type: string, enum: [theme_big_question, paper_theme_boundary_review] }
        priority: { type: integer }
        title_zh: { type: string, minLength: 1, maxLength: 300 }
        paper_id: { $ref: "#/components/schemas/OpaqueWorkbenchId" }
        theme_id:
          oneOf:
            - { $ref: "#/components/schemas/OpaqueWorkbenchId" }
            - { type: "null" }
        candidate_theme_id:
          oneOf:
            - { $ref: "#/components/schemas/OpaqueWorkbenchId" }
            - { type: "null" }
        status: { type: string }
        revision: { $ref: "#/components/schemas/ThemeReviewRevision" }
        assignee:
          oneOf:
            - { $ref: "#/components/schemas/OpaqueWorkbenchId" }
            - { type: "null" }
        boundary_mode: { type: string }
        candidate_basis_zh: { type: string }
        source_binding:
          oneOf:
            - { $ref: "#/components/schemas/ThemeReviewSourceBinding" }
            - { type: "null" }
        source_binding_candidates: { type: array, maxItems: 1, items: { $ref: "#/components/schemas/ThemeReviewSourceBindingCandidate" } }
        base_snapshot_sha256: { $ref: "#/components/schemas/Sha256" }
        task_input_sha256: { $ref: "#/components/schemas/Sha256" }
        target_counts: { $ref: "#/components/schemas/ThemeReviewTargetCounts" }
        state: { $ref: "#/components/schemas/ThemeReviewTaskState" }
        base: { $ref: "#/components/schemas/ThemeReviewBase" }
        gap_counts: { $ref: "#/components/schemas/ThemeReviewGapCounts" }
        write_capabilities: { $ref: "#/components/schemas/ThemeReviewWriteCapabilities" }
        allowed_actions: { $ref: "#/components/schemas/ThemeReviewAllowedActions" }
        authority: { $ref: "#/components/schemas/ThemeReviewAuthority" }
        target_atomic_part_ids: { type: array, maxItems: 4096, uniqueItems: true, items: { $ref: "#/components/schemas/OpaqueWorkbenchId" } }
        target_printed_question_ids: { type: array, maxItems: 4096, uniqueItems: true, items: { $ref: "#/components/schemas/OpaqueWorkbenchId" } }
        allowed_theme_ids: { type: array, maxItems: 4096, uniqueItems: true, items: { $ref: "#/components/schemas/OpaqueWorkbenchId" } }
        current_tags: { type: array, maxItems: 4096, items: { type: object } }
        current_hierarchy: { type: object }
        current_dependencies: { type: array, maxItems: 4096, items: { type: object } }
        source_order: { type: array, maxItems: 4096, items: { type: object } }
        evidence_bindings: { type: array, maxItems: 20000, items: { type: object } }
        node_evidence_ids: { type: array, maxItems: 4096, items: { type: object } }
        printed_questions: { type: array, maxItems: 4096, items: { type: object } }
        atomic_parts: { type: array, maxItems: 4096, items: { type: object } }
        shared_materials: { type: array, maxItems: 4096 }
        change_sets: { type: array, maxItems: 4096, items: { type: object } }
        decisions: { type: array, maxItems: 4096, items: { type: object } }
        latest_change_set:
          oneOf:
            - { type: object }
            - { type: "null" }
        latest_decision:
          oneOf:
            - { type: object }
            - { type: "null" }
    ThemeReviewTaskProjectionV1:
      title: Legacy v1 task projection
      description: A replay-compatible legacy task has no source projection and cannot carry a source action candidate.
      allOf:
        - { $ref: "#/components/schemas/ThemeReviewTaskProjectionBase" }
        - type: object
          required: [source_binding, source_binding_candidates]
          properties:
            source_binding: { type: "null" }
            source_binding_candidates: { type: array, maxItems: 0 }
    ThemeReviewTaskProjectionV2:
      title: Source-enhanced v2 task projection
      description: Every v2 task carries read-only source context. At most the paper's one canonical source-review task carries one frozen writable source candidate; all sibling tasks expose an empty candidate array.
      allOf:
        - { $ref: "#/components/schemas/ThemeReviewTaskProjectionBase" }
        - type: object
          required: [source_binding, source_binding_candidates]
          properties:
            source_binding: { $ref: "#/components/schemas/ThemeReviewSourceBinding" }
            source_binding_candidates: { type: array, maxItems: 1, items: { $ref: "#/components/schemas/ThemeReviewSourceBindingCandidate" } }
    ThemeReviewTaskProjection:
      description: Exactly one legacy-v1 or source-enhanced-v2 projection must match.
      oneOf:
        - { $ref: "#/components/schemas/ThemeReviewTaskProjectionV1" }
        - { $ref: "#/components/schemas/ThemeReviewTaskProjectionV2" }
    ThemeReviewTaskListEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, request_id, data]
      properties:
        contract_version: { const: shchem.gateway.v1 }
        request_id: { type: string }
        data:
          type: object
          additionalProperties: false
          required: [schema_version, catalog_sha256, items, count, total, limit, offset, filters, authority]
          properties:
            schema_version: { const: shchem_gateway_theme_review_v2 }
            catalog_sha256: { $ref: "#/components/schemas/Sha256" }
            items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ThemeReviewTaskProjection" } }
            count: { type: integer, minimum: 0, maximum: 200 }
            total: { type: integer, minimum: 0 }
            limit: { type: integer, minimum: 1, maximum: 200 }
            offset: { type: integer, minimum: 0 }
            filters:
              type: object
              additionalProperties: false
              required: [task_kind, paper_id, state]
              properties:
                task_kind: { oneOf: [{ type: string }, { type: "null" }] }
                paper_id: { oneOf: [{ $ref: "#/components/schemas/OpaqueWorkbenchId" }, { type: "null" }] }
                state: { oneOf: [{ type: string }, { type: "null" }] }
            authority: { $ref: "#/components/schemas/ThemeReviewAuthority" }
    ThemeReviewTaskDetailEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, request_id, data]
      properties:
        contract_version: { const: shchem.gateway.v1 }
        request_id: { type: string }
        data: { $ref: "#/components/schemas/ThemeReviewTaskProjection" }
    TagPatchPublicNodeIdentity:
      type: object
      additionalProperties: false
      required: [node_type, node_id, paper_id, public_manifest_sha256, public_atomic_layer_sha256, public_record_sha256, public_record_size_bytes]
      properties:
        node_type: { const: atomic_part }
        node_id: { $ref: "#/components/schemas/OpaqueWorkbenchId" }
        paper_id: { $ref: "#/components/schemas/OpaqueWorkbenchId" }
        public_manifest_sha256: { $ref: "#/components/schemas/Sha256" }
        public_atomic_layer_sha256: { $ref: "#/components/schemas/Sha256" }
        public_record_sha256: { $ref: "#/components/schemas/Sha256" }
        public_record_size_bytes: { type: integer, minimum: 1 }
    TagPatchFactorValue:
      anyOf:
        - { type: number, minimum: 0 }
        - { type: string, minLength: 1, maxLength: 128 }
        - type: object
          additionalProperties: false
          required: [value]
          properties: { value: { oneOf: [{ type: number, minimum: 0 }, { type: string, minLength: 1, maxLength: 128 }] } }
    TagPatchDifficultyFactors:
      type: object
