    WorkbenchReleaseRollbackRequest:
      type: object
      additionalProperties: false
      required: [run_id, expected_revision, reason_zh]
      properties:
        run_id: { $ref: "#/components/schemas/WorkbenchReleaseRunId" }
        expected_revision: { $ref: "#/components/schemas/WorkbenchReleaseRevision" }
        reason_zh: { type: string, minLength: 1, maxLength: 500, pattern: '.*[\u3400-\u9FFF].*' }
    WorkbenchReleaseFreezeData:
