      description: Valid only for a v2 task projection with a non-null source_binding. All five arrays are mandatory; non-canonical same-paper tasks submit source_binding_candidates as an empty array and cannot invent a source action.
      additionalProperties: false
      required: [expected_revision, idempotency_key, base_task_input_sha256, tag_replacements, hierarchy_replacements, atomic_boundary_candidates, dependency_replacements, source_binding_candidates]
      properties:
        expected_revision: { $ref: "#/components/schemas/ThemeReviewRevision" }
        idempotency_key: { $ref: "#/components/schemas/ThemeReviewIdempotencyKey" }
        base_task_input_sha256: { $ref: "#/components/schemas/Sha256" }
        tag_replacements: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/ThemeReviewTagReplacement" } }
        hierarchy_replacements: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/ThemeReviewHierarchyReplacement" } }
        atomic_boundary_candidates: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/ThemeReviewBoundaryCandidate" } }
        dependency_replacements: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/ThemeReviewDependencyReplacement" } }
        source_binding_candidates: { type: array, maxItems: 1, items: { $ref: "#/components/schemas/ThemeReviewSourceBindingAction" } }
    ThemeReviewChangeSetRequest:
      description: Exactly one generation-specific request shape must match; v1 and v2 cannot be mixed.
      oneOf:
        - { $ref: "#/components/schemas/ThemeReviewChangeSetRequestV1" }
        - { $ref: "#/components/schemas/ThemeReviewChangeSetRequestV2" }
    ThemeReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, idempotency_key, change_set_id, verdict, reason_zh, evidence_ids]
      properties:
        expected_revision: { $ref: "#/components/schemas/ThemeReviewRevision" }
        idempotency_key: { $ref: "#/components/schemas/ThemeReviewIdempotencyKey" }
        change_set_id: { $ref: "#/components/schemas/OpaqueWorkbenchId" }
        verdict: { type: string, enum: [accept_candidate_overlay, reject, request_changes, blocked] }
        reason_zh: { type: string, minLength: 1, maxLength: 4000 }
        evidence_ids: { type: array, minItems: 1, maxItems: 256, uniqueItems: true, items: { $ref: "#/components/schemas/OpaqueWorkbenchId" } }
