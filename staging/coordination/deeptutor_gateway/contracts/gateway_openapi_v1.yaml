            - { type: integer, minimum: 0 }
            - { type: "null" }
        atomic_parts: { type: integer, minimum: 0 }
        display_atomic_units: { type: integer, minimum: 0 }
        unassigned_atomic_parts: { type: integer, minimum: 0 }
    WorkbenchProductBlocker:
