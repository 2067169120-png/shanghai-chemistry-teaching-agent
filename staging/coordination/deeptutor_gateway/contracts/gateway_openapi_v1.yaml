      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{2,99}$' }
        message_zh: { type: string, minLength: 1, maxLength: 1000 }
        details: { type: object, maxProperties: 100, additionalProperties: true }
    PaperBlueprintInventoryGap:
      type: object
      additionalProperties: false
      required: [code, message_zh, affected_theme_ids, affected_atomic_ids, missing_fields]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{2,99}$' }
        message_zh: { type: string, minLength: 1, maxLength: 1000 }
        affected_theme_ids: { $ref: "#/components/schemas/PaperBlueprintStringIdArray" }
        affected_atomic_ids: { $ref: "#/components/schemas/PaperBlueprintStringIdArray" }
        missing_fields: { $ref: "#/components/schemas/PaperBlueprintStringIdArray" }
    PaperBlueprintMissingQuestion:
      type: object
      additionalProperties: false
      required: [constraint, required, available, shortfall, message_zh]
      properties:
        constraint: { type: string, minLength: 1, maxLength: 120 }
        value: { type: string, minLength: 1, maxLength: 240 }
        required: { type: integer, minimum: 0 }
        available: { type: integer, minimum: 0 }
        shortfall: { type: integer, minimum: 0 }
        message_zh: { type: string, minLength: 1, maxLength: 1000 }
    PaperBlueprintRelaxation:
      type: object
      additionalProperties: false
      required: [code, message_zh, changes]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{2,99}$' }
        message_zh: { type: string, minLength: 1, maxLength: 1000 }
        changes:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 240 }
    PaperBlueprintWarning:
      type: object
      additionalProperties: false
      required: [code, message_zh]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{2,99}$' }
        message_zh: { type: string, minLength: 1, maxLength: 1000 }
    PaperBlueprintPreviewData:
      type: object
      additionalProperties: false
      required: [schema_version, mode, data_snapshot_id, status, conflicts, inventory_gaps, missing_questions, relaxation_options, warnings, request_sha256, preview_revision, candidate_expires_at, candidates]
      properties:
        schema_version: { const: shchem.paper-blueprint-workbench.v1 }
        mode: { $ref: "#/components/schemas/PaperBlueprintMode" }
        data_snapshot_id: { $ref: "#/components/schemas/PaperBlueprintSha256" }
        status: { type: string, enum: [feasible, infeasible, indeterminate] }
        conflicts:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/PaperBlueprintIssue" }
        inventory_gaps:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/PaperBlueprintInventoryGap" }
        missing_questions:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/PaperBlueprintMissingQuestion" }
        relaxation_options:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/PaperBlueprintRelaxation" }
        warnings:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/PaperBlueprintWarning" }
        request_sha256: { $ref: "#/components/schemas/PaperBlueprintSha256" }
        preview_revision: { $ref: "#/components/schemas/PaperBlueprintPreviewRevision" }
        candidate_expires_at: { $ref: "#/components/schemas/PaperBlueprintTimestamp" }
        candidates:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/PaperBlueprintCandidate" }
      allOf:
        - if: { properties: { status: { const: feasible } }, required: [status] }
          then: { properties: { candidates: { minItems: 1 } } }
          else: { properties: { candidates: { maxItems: 0 } } }
    PaperBlueprintPreviewEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, request_id, data]
      properties:
        contract_version: { const: shchem.gateway.v1 }
        request_id: { type: string, minLength: 1 }
        data: { $ref: "#/components/schemas/PaperBlueprintPreviewData" }
    PaperBlueprintApproveRequest:
      type: object
      additionalProperties: false
      required: [candidate_id, preview_snapshot_sha256, data_snapshot_id]
      properties:
        candidate_id: { $ref: "#/components/schemas/PaperBlueprintCandidateId" }
        preview_snapshot_sha256: { $ref: "#/components/schemas/PaperBlueprintSha256" }
        data_snapshot_id: { $ref: "#/components/schemas/PaperBlueprintSha256" }
    PaperBlueprintApprovalData:
      type: object
      additionalProperties: false
      required: [schema_version, preview_approval_id, candidate_id, preview_snapshot_sha256, data_snapshot_id, preview_revision, approved_revision, status, approved_at, expires_at, export_job_id, idempotent_replay]
      properties:
        schema_version: { const: shchem.paper-blueprint-preview-approval.v1 }
        preview_approval_id: { $ref: "#/components/schemas/PaperBlueprintApprovalId" }
        candidate_id: { $ref: "#/components/schemas/PaperBlueprintCandidateId" }
        preview_snapshot_sha256: { $ref: "#/components/schemas/PaperBlueprintSha256" }
        data_snapshot_id: { $ref: "#/components/schemas/PaperBlueprintSha256" }
        preview_revision: { $ref: "#/components/schemas/PaperBlueprintPreviewRevision" }
        approved_revision: { $ref: "#/components/schemas/PaperBlueprintApprovedRevision" }
        status: { const: approved }
        approved_at: { $ref: "#/components/schemas/PaperBlueprintTimestamp" }
        expires_at: { $ref: "#/components/schemas/PaperBlueprintTimestamp" }
        export_job_id:
          oneOf:
            - { $ref: "#/components/schemas/PaperExportJobId" }
            - { type: "null" }
        idempotent_replay: { type: boolean }
    PaperBlueprintApprovalEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, request_id, data]
      properties:
        contract_version: { const: shchem.gateway.v1 }
        request_id: { type: string, minLength: 1 }
        data: { $ref: "#/components/schemas/PaperBlueprintApprovalData" }
    PaperBlueprintExportRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    PaperBlueprintApprovedExportData:
      type: object
      additionalProperties: false
      required: [schema_version, preview_approval_id, approved_revision, idempotent_replay, job]
      properties:
        schema_version: { const: shchem.paper-blueprint-approved-export.v1 }
        preview_approval_id: { $ref: "#/components/schemas/PaperBlueprintApprovalId" }
        approved_revision: { $ref: "#/components/schemas/PaperBlueprintApprovedRevision" }
        idempotent_replay: { type: boolean }
        job: { $ref: "#/components/schemas/PaperExportJobData" }
    PaperBlueprintApprovedExportEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, request_id, data]
      properties:
        contract_version: { const: shchem.gateway.v1 }
        request_id: { type: string, minLength: 1 }
        data: { $ref: "#/components/schemas/PaperBlueprintApprovedExportData" }
    PaperExportSha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    PaperExportJobId:
      type: string
      pattern: '^WBEXP-[0-9a-f]{32}$'
    PaperExportArtifactId:
      type: string
      enum: [student_docx, student_pdf, teacher_docx, teacher_pdf]
    PaperExportScope:
      type: string
      enum: [wave1, master, supplemental]
    PaperExportSelection:
      type: object
      additionalProperties: false
      required: [scope, selection_unit, theme_id, target_atomic_id, expected_data_snapshot_id]
      properties:
        scope: { $ref: "#/components/schemas/PaperExportScope" }
        selection_unit: { type: string, enum: [theme, dependency, atomic] }
        theme_id: { type: string, minLength: 1, maxLength: 240 }
        target_atomic_id:
          oneOf:
            - { type: string, minLength: 1, maxLength: 240 }
            - { type: "null" }
        expected_data_snapshot_id: { $ref: "#/components/schemas/PaperExportSha256" }
      allOf:
        - if:
            properties:
              selection_unit: { const: theme }
            required: [selection_unit]
          then:
            properties:
              target_atomic_id: { type: "null" }
          else:
            properties:
              target_atomic_id: { type: string, minLength: 1, maxLength: 240 }
    PaperExportStartRequest:
      type: object
      additionalProperties: false
      required: [title_zh, duration_minutes, selections]
      properties:
        title_zh: { type: string, minLength: 1, maxLength: 120 }
        subtitle_zh:
          oneOf:
            - { type: string, minLength: 1, maxLength: 180 }
            - { type: "null" }
        duration_minutes: { type: integer, minimum: 1, maximum: 300 }
        show_question_scores:
          type: boolean
          default: false
          description: Whether to add scores to question content; teacher answer scoring always retains scores. Existing scores inside source images are not erased.
        numbering_mode:
          type: string
          enum: [continuous_across_paper, restart_within_each_theme]
          default: continuous_across_paper
        score_per_atomic: { type: integer, minimum: 1, maximum: 20, default: 1 }
        answer_space_lines: { type: integer, minimum: 0, maximum: 20, default: 3 }
        atomic_settings:
          type: object
          propertyNames: { type: string, minLength: 1, maxLength: 240 }
          additionalProperties:
            type: object
            additionalProperties: false
            required: [score, answer_space_lines]
            properties:
              score: { type: integer, minimum: 1, maximum: 30 }
              answer_space_lines: { type: integer, minimum: 0, maximum: 20 }
        selections:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/PaperExportSelection" }
    PaperExportProgress:
      type: object
      additionalProperties: false
      required: [stage, percent, message_zh]
      properties:
        stage:
          type: string
          enum: [queued, loading_theme_catalog, loading_question_assets, rendering, completed, failed]
        percent: { type: integer, minimum: 0, maximum: 100 }
        message_zh: { type: string, minLength: 1, maxLength: 300 }
    PaperExportCounts:
      type: object
      additionalProperties: false
      properties:
        theme_count: { type: integer, minimum: 1, maximum: 100 }
        printed_question_count: { type: integer, minimum: 1, maximum: 10000 }
        atomic_part_count: { type: integer, minimum: 1, maximum: 10000 }
        shared_material_count: { type: integer, minimum: 0, maximum: 10000 }
        total_score: { type: number, minimum: 1, maximum: 200000 }
      oneOf:
        - { maxProperties: 0 }
        - required: [theme_count, printed_question_count, atomic_part_count, shared_material_count, total_score]
    PaperExportArtifact:
      type: object
      additionalProperties: false
      required: [artifact_id, format, audience, filename, sha256, size_bytes, page_count, download_path]
      properties:
        artifact_id: { $ref: "#/components/schemas/PaperExportArtifactId" }
        format: { type: string, enum: [docx, pdf] }
        audience: { type: string, enum: [student, teacher] }
        filename: { type: string, minLength: 1, maxLength: 240 }
        sha256: { $ref: "#/components/schemas/PaperExportSha256" }
        size_bytes: { type: integer, minimum: 1 }
        page_count: { type: integer, minimum: 1, maximum: 10000 }
        download_path:
          type: string
          pattern: '^/api/v1/prep/exports/WBEXP-[0-9a-f]{32}/artifacts/(student_docx|student_pdf|teacher_docx|teacher_pdf)$'
      allOf:
        - if: { properties: { artifact_id: { const: student_docx } }, required: [artifact_id] }
          then: { properties: { format: { const: docx }, audience: { const: student } } }
        - if: { properties: { artifact_id: { const: student_pdf } }, required: [artifact_id] }
          then: { properties: { format: { const: pdf }, audience: { const: student } } }
        - if: { properties: { artifact_id: { const: teacher_docx } }, required: [artifact_id] }
          then: { properties: { format: { const: docx }, audience: { const: teacher } } }
        - if: { properties: { artifact_id: { const: teacher_pdf } }, required: [artifact_id] }
          then: { properties: { format: { const: pdf }, audience: { const: teacher } } }
    PaperExportError:
      type: object
      additionalProperties: false
      required: [code, message_zh]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{2,99}$' }
        message_zh: { type: string, minLength: 1, maxLength: 500 }
        http_status: { type: integer, minimum: 400, maximum: 599 }
        details: { type: object, maxProperties: 50 }
    PaperExportJobData:
      type: object
      additionalProperties: false
      required: [schema_version, job_id, status, created_at, updated_at, scope, data_snapshot_id, title_zh, request_digest, progress, counts, artifacts, error]
      properties:
        schema_version: { const: shchem.paper-export-workbench-job.v1 }
        job_id: { $ref: "#/components/schemas/PaperExportJobId" }
        status: { type: string, enum: [queued, running, completed, failed] }
        created_at:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?Z$'
        updated_at:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?Z$'
        scope: { $ref: "#/components/schemas/PaperExportScope" }
        data_snapshot_id: { $ref: "#/components/schemas/PaperExportSha256" }
        title_zh: { type: string, minLength: 1, maxLength: 120 }
        request_digest: { $ref: "#/components/schemas/PaperExportSha256" }
        progress: { $ref: "#/components/schemas/PaperExportProgress" }
        counts: { $ref: "#/components/schemas/PaperExportCounts" }
        artifacts:
          type: array
          maxItems: 4
          uniqueItems: true
          items: { $ref: "#/components/schemas/PaperExportArtifact" }
        error:
          oneOf:
            - { $ref: "#/components/schemas/PaperExportError" }
            - { type: "null" }
      allOf:
        - if:
            properties:
              status: { const: completed }
            required: [status]
          then:
            properties:
              artifacts:
                minItems: 4
                maxItems: 4
                allOf:
                  - { contains: { type: object, properties: { artifact_id: { const: student_docx } }, required: [artifact_id] }, minContains: 1, maxContains: 1 }
                  - { contains: { type: object, properties: { artifact_id: { const: student_pdf } }, required: [artifact_id] }, minContains: 1, maxContains: 1 }
                  - { contains: { type: object, properties: { artifact_id: { const: teacher_docx } }, required: [artifact_id] }, minContains: 1, maxContains: 1 }
                  - { contains: { type: object, properties: { artifact_id: { const: teacher_pdf } }, required: [artifact_id] }, minContains: 1, maxContains: 1 }
              error: { type: "null" }
        - if:
            properties:
              status: { const: failed }
            required: [status]
          then:
            properties:
              error: { $ref: "#/components/schemas/PaperExportError" }
    PaperExportJobEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, request_id, data]
      properties:
        contract_version: { const: shchem.gateway.v1 }
        request_id: { type: string, minLength: 1 }
        data: { $ref: "#/components/schemas/PaperExportJobData" }
    WorkbenchRegistrySha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    WorkbenchRegistryAuthority:
      type: object
