        ui_file_hashes_verified: { const: true }
        product_manifests_verified: { const: true }
        product_counts_derived: { const: true }
        stable_product_order: { const: true }
        unknown_products_rejected: { const: true }
        duplicate_products_rejected: { const: true }
        incompatible_products_rejected: { const: true }
        question_content_exposed: { const: false }
        source_paths_exposed: { const: false }
        answer_text_exposed: { const: false }
        fail_closed: { const: true }
        registry_file_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
    WorkbenchProductRegistryData:
