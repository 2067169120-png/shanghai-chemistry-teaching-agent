      required: [expected_revision, idempotency_key, base_task_input_sha256, tag_replacements, hierarchy_replacements, atomic_boundary_candidates, dependency_replacements]
      properties:
        expected_revision: { $ref: "#/components/schemas/ThemeReviewRevision" }
        idempotency_key: { $ref: "#/components/schemas/ThemeReviewIdempotencyKey" }
        base_task_input_sha256: { $ref: "#/components/schemas/Sha256" }
        tag_replacements: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/ThemeReviewTagReplacement" } }
        hierarchy_replacements: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/ThemeReviewHierarchyReplacement" } }
        atomic_boundary_candidates: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/ThemeReviewBoundaryCandidate" } }
        dependency_replacements: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/ThemeReviewDependencyReplacement" } }
    ThemeReviewChangeSetRequestV2:
      type: object
