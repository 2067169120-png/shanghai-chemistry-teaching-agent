              additionalProperties: false
              required: [connected, frozen_readiness_mutated, offline_browse_available]
              properties:
                connected: { type: boolean }
                frozen_readiness_mutated: { const: false }
                offline_browse_available: { const: true }
    WorkbenchProductRegistryEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, request_id, data]
      properties:
        contract_version: { const: shchem.gateway.v1 }
        request_id: { type: string, minLength: 1 }
        data: { $ref: "#/components/schemas/WorkbenchProductRegistryData" }
    WorkbenchReadinessEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, request_id, data]
      properties:
        contract_version: { const: shchem.gateway.v1 }
        request_id: { type: string, minLength: 1 }
        data: { $ref: "#/components/schemas/WorkbenchReadinessData" }
    WorkbenchReleaseId:
      type: string
      pattern: '^WBREL-[0-9a-f]{64}$'
    WorkbenchReleaseRevision:
      type: string
      pattern: '^WBREV-[0-9a-f]{32}$'
    WorkbenchReleaseRunId:
      type: string
      pattern: '^WBRUN-[0-9a-f]{32}$'
    WorkbenchReleaseReceiptId:
      type: string
      pattern: '^WBRR-[0-9a-f]{32}$'
    WorkbenchReleaseTimestamp:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?Z$'
    WorkbenchServingRelease:
      type: object
      additionalProperties: false
      required: [mode, release_id, selected_revision, candidate_manifest_sha256, candidate_manifest_bytes, closure_sha256, browse_snapshot_id, ui_build_id, data_snapshot_id, backend_build_id, candidate_only, human_reviewed, teaching_use_allowed, publication_allowed]
      properties:
        mode: { type: string, enum: [bootstrap_live, frozen] }
        release_id:
          oneOf:
            - { $ref: "#/components/schemas/WorkbenchReleaseId" }
            - { type: "null" }
        selected_revision:
          oneOf:
            - { $ref: "#/components/schemas/WorkbenchReleaseRevision" }
            - { type: "null" }
        candidate_manifest_sha256:
          oneOf:
            - { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
            - { type: "null" }
        candidate_manifest_bytes:
          oneOf:
            - { type: integer, minimum: 1, maximum: 16777216 }
            - { type: "null" }
        closure_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        browse_snapshot_id:
          oneOf:
            - { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
            - { type: "null" }
        ui_build_id: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        data_snapshot_id: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        backend_build_id:
          oneOf:
            - { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
            - { type: "null" }
        candidate_only: { const: true }
        human_reviewed: { const: false }
        teaching_use_allowed: { const: false }
        publication_allowed: { const: false }
      allOf:
        - if:
            properties: { mode: { const: bootstrap_live } }
            required: [mode]
          then:
            properties:
              release_id: { type: "null" }
              selected_revision: { type: "null" }
              candidate_manifest_sha256: { type: "null" }
              candidate_manifest_bytes: { type: "null" }
              browse_snapshot_id: { type: "null" }
              backend_build_id: { type: "null" }
          else:
            properties:
              release_id: { $ref: "#/components/schemas/WorkbenchReleaseId" }
              selected_revision: { $ref: "#/components/schemas/WorkbenchReleaseRevision" }
              candidate_manifest_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
              candidate_manifest_bytes: { type: integer, minimum: 1, maximum: 16777216 }
              browse_snapshot_id: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
              backend_build_id: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
    WorkbenchSelectedRelease:
      type: object
      additionalProperties: false
      required: [release_id, revision, action, updated_at, activation_sequence, candidate_manifest_sha256, candidate_manifest_bytes]
      properties:
        release_id: { $ref: "#/components/schemas/WorkbenchReleaseId" }
        revision: { $ref: "#/components/schemas/WorkbenchReleaseRevision" }
        action: { type: string, enum: [activate, rollback] }
        updated_at: { $ref: "#/components/schemas/WorkbenchReleaseTimestamp" }
        activation_sequence: { type: integer, minimum: 1, maximum: 999999999999 }
        candidate_manifest_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        candidate_manifest_bytes: { type: integer, minimum: 1, maximum: 16777216 }
    WorkbenchReleaseCheckSummary:
      type: object
      additionalProperties: false
      required: [check_id, status, exit_code, duration_ms, failure_code, stdout_safe_summary, stderr_safe_summary, stdout_sha256, stdout_bytes, stderr_sha256, stderr_bytes]
      properties:
        check_id: { type: string, enum: [gateway_full_pytest, central_status, central_validate, node_check_overlay, openapi_contract, release_closure, launcher_smoke] }
        status: { type: string, enum: [pass, fail, timeout, output_limit, cancelled, spawn_error, not_run] }
        exit_code:
          oneOf:
            - { type: integer, minimum: -2147483648, maximum: 2147483647 }
            - { type: "null" }
        duration_ms: { type: integer, minimum: 0, maximum: 86400000 }
        failure_code:
          oneOf:
            - { type: string, pattern: '^[a-z][a-z0-9_]{2,99}$' }
            - { type: "null" }
        stdout_safe_summary: { type: string, maxLength: 2048 }
        stderr_safe_summary: { type: string, maxLength: 2048 }
        stdout_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        stdout_bytes: { type: integer, minimum: 0, maximum: 1073741824 }
        stderr_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        stderr_bytes: { type: integer, minimum: 0, maximum: 1073741824 }
    WorkbenchReleaseReceiptCheck:
      type: object
      additionalProperties: false
      required: [check_id, status, evidence_sha256, evidence_bytes]
      properties:
        check_id: { type: string, enum: [gateway_full_pytest, central_status, central_validate, node_check_overlay, openapi_contract, release_closure, launcher_smoke] }
        status: { type: string, enum: [pass, fail] }
        evidence_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        evidence_bytes: { type: integer, minimum: 1, maximum: 1073741824 }
    WorkbenchReleaseReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, receipt_id, release_id, candidate_manifest_sha256, candidate_manifest_bytes, recipe_id, recipe_sha256, recipe_bytes, verdict, checks, failures, completed_at, model_invoked, human_reviewed, teaching_use_allowed, publication_allowed, self_sha256]
      properties:
        schema_version: { const: shchem.workbench.regression_receipt.v1 }
        receipt_id: { $ref: "#/components/schemas/WorkbenchReleaseReceiptId" }
        release_id: { $ref: "#/components/schemas/WorkbenchReleaseId" }
        candidate_manifest_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        candidate_manifest_bytes: { type: integer, minimum: 1, maximum: 16777216 }
        recipe_id: { const: SHCHEM-WORKBENCH-RELEASE-REGRESSION-V1 }
        recipe_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        recipe_bytes: { type: integer, minimum: 1, maximum: 1048576 }
        verdict: { type: string, enum: [PASS, FAIL] }
        checks:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/WorkbenchReleaseReceiptCheck" }
        failures:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9_]{2,99}$' }
        completed_at: { $ref: "#/components/schemas/WorkbenchReleaseTimestamp" }
        model_invoked: { const: false }
        human_reviewed: { const: false }
        teaching_use_allowed: { const: false }
        publication_allowed: { const: false }
        self_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
    WorkbenchReleaseFailureSummary:
      type: object
      additionalProperties: false
      required: [code, message_zh]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{2,99}$' }
        message_zh: { type: string, minLength: 1, maxLength: 300 }
    WorkbenchReleaseRegressionState:
      type: object
      additionalProperties: false
      required: [release_id, state, cancellable, automatic_activation]
      properties:
        run_id: { $ref: "#/components/schemas/WorkbenchReleaseRunId" }
        receipt_id: { $ref: "#/components/schemas/WorkbenchReleaseReceiptId" }
        release_id: { $ref: "#/components/schemas/WorkbenchReleaseId" }
        state: { type: string, enum: [not_started, running, reserved_incomplete_or_running, failed_closed_incomplete_evidence, failed_closed, completed] }
        verdict: { type: string, enum: [PASS, FAIL] }
        reserved_at: { $ref: "#/components/schemas/WorkbenchReleaseTimestamp" }
        started_at: { $ref: "#/components/schemas/WorkbenchReleaseTimestamp" }
        completed_at: { $ref: "#/components/schemas/WorkbenchReleaseTimestamp" }
        receipt_committed: { type: boolean }
        evidence_committed: { type: boolean }
        rerun_allowed: { const: false }
        checks:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: "#/components/schemas/WorkbenchReleaseCheckSummary" }
        receipt: { $ref: "#/components/schemas/WorkbenchReleaseReceipt" }
        trusted_pass_current: { type: boolean }
        failure: { $ref: "#/components/schemas/WorkbenchReleaseFailureSummary" }
        cancellation_requested: { const: true }
        cancellable: { type: boolean }
        automatic_activation: { const: false }
        model_invoked: { const: false }
        api_key_accessed: { const: false }
        student_private_domain_accessed: { const: false }
        human_reviewed: { const: false }
        teaching_use_allowed: { const: false }
        publication_allowed: { const: false }
    WorkbenchSelectedReleaseTrust:
      type: object
      description: Fail-closed trust state for the selected release pointer. Replacement trust permits replacing a historical pointer only; it never grants serving or rollback eligibility.
      additionalProperties: false
      required: [state, current_trusted, replacement_trusted, serving_eligible, rollback_eligible, replacement_only]
      properties:
        state: { type: string, enum: [none, current_trusted, historical_for_replacement_only] }
        current_trusted: { type: boolean }
        replacement_trusted: { type: boolean }
        serving_eligible: { type: boolean }
        rollback_eligible: { type: boolean }
        replacement_only: { type: boolean }
      oneOf:
        - properties:
            state: { const: none }
            current_trusted: { const: false }
            replacement_trusted: { const: false }
            serving_eligible: { const: false }
            rollback_eligible: { const: false }
            replacement_only: { const: false }
        - properties:
            state: { const: current_trusted }
            current_trusted: { const: true }
            replacement_trusted: { const: true }
            serving_eligible: { const: true }
            rollback_eligible: { const: true }
            replacement_only: { const: false }
        - properties:
            state: { const: historical_for_replacement_only }
            current_trusted: { const: false }
            replacement_trusted: { const: true }
            serving_eligible: { const: false }
            rollback_eligible: { const: false }
            replacement_only: { const: true }
    WorkbenchReleaseStatusData:
      type: object
      additionalProperties: false
      required: [schema_version, serving_release, selected_release, selected_release_trust, restart_required, selection_effect_policy, active_regression, automatic_activation, client_supplied_commands_allowed, candidate_only, human_reviewed, teaching_use_allowed, publication_allowed]
      properties:
        schema_version: { const: shchem.workbench.release_gateway.v1 }
        serving_release: { $ref: "#/components/schemas/WorkbenchServingRelease" }
        selected_release:
          oneOf:
            - { $ref: "#/components/schemas/WorkbenchSelectedRelease" }
            - { type: "null" }
        selected_release_trust: { $ref: "#/components/schemas/WorkbenchSelectedReleaseTrust" }
        restart_required: { type: boolean }
        selection_effect_policy: { const: next_clean_restart_only }
        active_regression:
          oneOf:
            - { $ref: "#/components/schemas/WorkbenchReleaseRegressionState" }
            - { type: "null" }
        automatic_activation: { const: false }
        client_supplied_commands_allowed: { const: false }
        candidate_only: { const: true }
        human_reviewed: { const: false }
        teaching_use_allowed: { const: false }
        publication_allowed: { const: false }
      oneOf:
        - properties:
            selected_release: { type: "null" }
            selected_release_trust:
              allOf:
                - { $ref: "#/components/schemas/WorkbenchSelectedReleaseTrust" }
                - properties: { state: { const: none } }
        - properties:
            selected_release: { $ref: "#/components/schemas/WorkbenchSelectedRelease" }
            selected_release_trust:
              allOf:
                - { $ref: "#/components/schemas/WorkbenchSelectedReleaseTrust" }
                - properties: { state: { enum: [current_trusted, historical_for_replacement_only] } }
    WorkbenchReleaseCandidateSummary:
      type: object
