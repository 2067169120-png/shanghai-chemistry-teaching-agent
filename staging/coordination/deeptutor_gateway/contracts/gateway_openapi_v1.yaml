  /api/v1/students/{student_id}/jobs/{job_id}:
    get:
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Student-scoped job status } }
  /api/v1/students/{student_id}/jobs/{job_id}/artifact.zip:
    get:
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Explicit synthetic test ZIP or gated teacher-managed delivery ZIP, without raw uploads } }
  /api/v1/figures/{figure_id}:
    get:
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Figure candidate } }
  /api/v1/publication/preflight:
    post:
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Publication remains fail-closed } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PresentationSha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    PresentationProjectId:
      type: string
      pattern: '^PPTPRJ-[0-9a-f]{32}$'
    PresentationOutlineRevision:
      type: string
      pattern: '^PPTOL-[0-9a-f]{32}$'
    PresentationVersionId:
      type: string
      pattern: '^PPTVER-[0-9a-f]{64}$'
    PresentationJobId:
      type: string
      pattern: '^PPTJOB-[0-9a-f]{64}$'
    PresentationTimestamp:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?Z$'
    PresentationArtifactId:
      type: string
      enum: [deck_json, pptx, qa_report, preview_montage]
    PresentationTextArray:
      type: array
      minItems: 1
      maxItems: 12
      items: { type: string, minLength: 1, maxLength: 500 }
    PresentationTextbookSelection:
      type: object
      additionalProperties: false
      required: [book_title, volume, chapter, section, publisher, evidence_note]
      properties:
        book_title: { type: string, minLength: 1, maxLength: 600 }
        volume: { type: string, minLength: 1, maxLength: 600 }
        chapter: { type: string, minLength: 1, maxLength: 600 }
        section: { type: string, minLength: 1, maxLength: 600 }
        publisher: { type: string, minLength: 1, maxLength: 600 }
        evidence_note: { type: string, minLength: 1, maxLength: 600 }
    PresentationLessonGoals:
      type: object
      additionalProperties: false
      required: [learning_objectives, key_points, difficult_points, prerequisites, lesson_emphasis]
      properties:
        learning_objectives: { $ref: "#/components/schemas/PresentationTextArray" }
        key_points: { $ref: "#/components/schemas/PresentationTextArray" }
        difficult_points: { $ref: "#/components/schemas/PresentationTextArray" }
        prerequisites: { $ref: "#/components/schemas/PresentationTextArray" }
        lesson_emphasis: { type: string, minLength: 1, maxLength: 800 }
    PresentationDiagnosisRequest:
      type: object
      additionalProperties: false
      required: [label, summary, common_error, cause_hypothesis, confidence, counterevidence]
      properties:
        label: { type: string, minLength: 1, maxLength: 300 }
        summary: { type: string, minLength: 1, maxLength: 1200 }
        common_error: { type: string, minLength: 1, maxLength: 800 }
        cause_hypothesis: { type: string, minLength: 1, maxLength: 800 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        counterevidence: { $ref: "#/components/schemas/PresentationTextArray" }
    PresentationClassroomPlanRequest:
      type: object
      additionalProperties: false
      required: [teacher_questions, anticipated_responses, homework]
      properties:
        teacher_questions: { $ref: "#/components/schemas/PresentationTextArray" }
        anticipated_responses: { $ref: "#/components/schemas/PresentationTextArray" }
        homework: { $ref: "#/components/schemas/PresentationTextArray" }
    PresentationThemeRequest:
      type: object
      additionalProperties: false
      required: [schema_version, scope, data_snapshot_id, theme_id, lesson_title, grade, duration_minutes, textbook_selection, lesson_goals, diagnosis, classroom_plan]
      properties:
        schema_version: { const: shchem.presentation-theme-request.v1 }
        scope: { type: string, enum: [wave1, master, supplemental] }
        data_snapshot_id: { $ref: "#/components/schemas/PresentationSha256" }
        theme_id: { type: string, minLength: 1, maxLength: 220 }
        lesson_title: { type: string, minLength: 1, maxLength: 300 }
        grade: { type: string, minLength: 1, maxLength: 200 }
        duration_minutes: { type: integer, minimum: 30, maximum: 120 }
        textbook_selection: { $ref: "#/components/schemas/PresentationTextbookSelection" }
        lesson_goals: { $ref: "#/components/schemas/PresentationLessonGoals" }
        diagnosis: { $ref: "#/components/schemas/PresentationDiagnosisRequest" }
        classroom_plan: { $ref: "#/components/schemas/PresentationClassroomPlanRequest" }
    PresentationProjectData:
      type: object
      additionalProperties: false
      required: [schema_version, project_id, title_zh, description_zh, status, candidate_only, candidate_status, teacher_review_status, publication_allowed, created_at, updated_at]
      properties:
        schema_version: { const: shchem.presentation-project.v1 }
        project_id: { $ref: "#/components/schemas/PresentationProjectId" }
        title_zh: { type: string, minLength: 1, maxLength: 200 }
        description_zh: { type: string, maxLength: 2000 }
        status: { const: draft }
        candidate_only: { const: true }
        candidate_status: { const: candidate_only }
        teacher_review_status: { const: pending_teacher_review }
        publication_allowed: { const: false }
        created_at: { $ref: "#/components/schemas/PresentationTimestamp" }
        updated_at: { $ref: "#/components/schemas/PresentationTimestamp" }
    PresentationSlide:
      type: object
      additionalProperties: false
      required: [slide_id, slide_number, slide_type, render_layout, title, learning_purpose, student_thinking_action, reveal_stage, content_blocks, chemical_expressions, assets, speaker_notes, teacher_questions, anticipated_responses, misconceptions, source_refs, estimated_minutes, theme_context]
      properties:
        slide_id: { type: string, pattern: '^SLIDE-[0-9a-f]{20}$' }
        slide_number: { type: integer, minimum: 1, maximum: 80 }
        slide_type: { type: string, minLength: 1, maxLength: 80 }
        render_layout: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 500 }
        learning_purpose: { type: string, minLength: 1, maxLength: 800 }
        student_thinking_action: { type: string, minLength: 1, maxLength: 800 }
        reveal_stage: { type: string, enum: [launch, prompt, scaffold, reveal, transfer] }
        content_blocks: { type: array, minItems: 1, maxItems: 12, items: { type: object } }
        chemical_expressions: { type: array, maxItems: 30, items: { type: object } }
        assets: { type: array, maxItems: 30, items: { type: object } }
        speaker_notes: { type: string, minLength: 1, maxLength: 20000 }
        teacher_questions: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 1200 } }
        anticipated_responses: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 1200 } }
        misconceptions: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 1600 } }
        source_refs: { type: array, minItems: 1, maxItems: 30, items: { type: object, additionalProperties: false, required: [label, detail], properties: { label: { type: string, minLength: 1, maxLength: 300 }, detail: { type: string, minLength: 1, maxLength: 3000 } } } }
        estimated_minutes: { type: integer, minimum: 1, maximum: 30 }
        theme_context: { type: object }
    PresentationDeckJson:
      type: object
      additionalProperties: false
      required: [deck_id, schema_version, input_digest, lesson_title, grade, total_minutes, slide_size, style, candidate_boundary, textbook_binding, theme_binding, diagnosis_binding, lesson_goals, lesson_flow, slides, homework, export_warnings, render_requirements]
      properties:
        deck_id: { type: string, pattern: '^PRES-[0-9a-f]{24}$' }
        schema_version: { const: shchem.presentation-deck-json.v1 }
        input_digest: { $ref: "#/components/schemas/PresentationSha256" }
        lesson_title: { type: string, minLength: 1, maxLength: 300 }
        grade: { type: string, minLength: 1, maxLength: 200 }
        total_minutes: { type: integer, minimum: 30, maximum: 120 }
        slide_size: { type: object, additionalProperties: false, required: [width, height, aspect_ratio], properties: { width: { const: 1280 }, height: { const: 720 }, aspect_ratio: { const: "16:9" } } }
        style: { type: object }
        candidate_boundary: { type: object }
        textbook_binding: { type: object }
        theme_binding: { type: object }
        diagnosis_binding: { type: object }
        lesson_goals: { type: object }
        lesson_flow: { type: array, minItems: 12, maxItems: 80, items: { type: object } }
        slides: { type: array, minItems: 12, maxItems: 80, items: { $ref: "#/components/schemas/PresentationSlide" } }
        homework: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 1, maxLength: 500 } }
        export_warnings: { type: array, minItems: 1, maxItems: 30, items: { type: string, minLength: 1, maxLength: 1000 } }
        render_requirements: { type: object }
    PresentationOutlineData:
      type: object
      additionalProperties: false
      required: [schema_version, project_id, revision, deck_json, candidate_only, candidate_status, teacher_review_status, publication_allowed, created_at, updated_at]
      properties:
        schema_version: { const: shchem.presentation-outline-projection.v1 }
        project_id: { $ref: "#/components/schemas/PresentationProjectId" }
        revision: { $ref: "#/components/schemas/PresentationOutlineRevision" }
        deck_json: { $ref: "#/components/schemas/PresentationDeckJson" }
        candidate_only: { const: true }
        candidate_status: { const: candidate_only }
        teacher_review_status: { const: pending_teacher_review }
        publication_allowed: { const: false }
        created_at: { $ref: "#/components/schemas/PresentationTimestamp" }
        updated_at: { $ref: "#/components/schemas/PresentationTimestamp" }
        idempotent_replay: { type: boolean }
    PresentationVersionData:
      type: object
      additionalProperties: false
      required: [schema_version, project_id, version_id, source_outline_revision, immutable, candidate_only, candidate_status, teacher_review_status, publication_allowed, created_at]
      properties:
        schema_version: { const: shchem.presentation-version.v1 }
        project_id: { $ref: "#/components/schemas/PresentationProjectId" }
        version_id: { $ref: "#/components/schemas/PresentationVersionId" }
        source_outline_revision: { $ref: "#/components/schemas/PresentationOutlineRevision" }
        immutable: { const: true }
        candidate_only: { const: true }
        candidate_status: { const: candidate_only }
        teacher_review_status: { const: pending_teacher_review }
        publication_allowed: { const: false }
        created_at: { $ref: "#/components/schemas/PresentationTimestamp" }
        idempotent_replay: { type: boolean }
    PresentationOutlineUpdateRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, deck_json]
      properties:
        expected_revision: { $ref: "#/components/schemas/PresentationOutlineRevision" }
        deck_json: { $ref: "#/components/schemas/PresentationDeckJson" }
    PresentationVersionCreateRequest:
      type: object
      additionalProperties: false
      required: [expected_outline_revision]
      properties:
        expected_outline_revision: { $ref: "#/components/schemas/PresentationOutlineRevision" }
    PresentationEmptyRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    PresentationJobProgress:
      type: object
      additionalProperties: false
      required: [stage, percent, message_zh]
      properties:
        stage: { type: string, minLength: 1, maxLength: 120 }
        percent: { type: integer, minimum: 0, maximum: 100 }
        message_zh: { type: string, minLength: 1, maxLength: 500 }
    PresentationJobArtifact:
      type: object
      additionalProperties: false
      required: [artifact_id, filename, size_bytes, sha256, content_type]
      properties:
        artifact_id: { $ref: "#/components/schemas/PresentationArtifactId" }
        filename: { type: string, minLength: 1, maxLength: 180 }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { $ref: "#/components/schemas/PresentationSha256" }
        content_type: { type: string, enum: [application/json, application/vnd.openxmlformats-officedocument.presentationml.presentation, image/png] }
    PresentationJobError:
      type: object
      additionalProperties: false
      required: [code, message_zh, http_status, details]
      properties:
        code: { type: string, minLength: 1, maxLength: 160 }
        message_zh: { type: string, minLength: 1, maxLength: 1000 }
        http_status: { type: integer, minimum: 400, maximum: 599 }
        details: { type: object }
    PresentationJobData:
      type: object
      additionalProperties: false
      required: [schema_version, job_id, project_id, version_id, version_sha256, status, attempt, retryable, progress, artifacts, qa_status, candidate_only, candidate_status, teacher_review_status, publication_allowed, error, created_at, updated_at, started_at, completed_at, retry_required]
      properties:
        schema_version: { const: shchem.presentation-render-job.v1 }
        job_id: { $ref: "#/components/schemas/PresentationJobId" }
        project_id: { $ref: "#/components/schemas/PresentationProjectId" }
        version_id: { $ref: "#/components/schemas/PresentationVersionId" }
        version_sha256: { $ref: "#/components/schemas/PresentationSha256" }
        status: { type: string, enum: [queued, running, cancel_requested, completed, failed, cancelled] }
        attempt: { type: integer, minimum: 1 }
        retryable: { type: boolean }
        progress: { $ref: "#/components/schemas/PresentationJobProgress" }
        artifacts: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/PresentationJobArtifact" } }
        qa_status: { oneOf: [{ type: string, minLength: 1, maxLength: 160 }, { type: "null" }] }
        candidate_only: { const: true }
        candidate_status: { const: candidate_only }
        teacher_review_status: { const: pending_teacher_review }
        publication_allowed: { const: false }
        error: { oneOf: [{ $ref: "#/components/schemas/PresentationJobError" }, { type: "null" }] }
        created_at: { $ref: "#/components/schemas/PresentationTimestamp" }
        updated_at: { $ref: "#/components/schemas/PresentationTimestamp" }
        started_at: { oneOf: [{ $ref: "#/components/schemas/PresentationTimestamp" }, { type: "null" }] }
        completed_at: { oneOf: [{ $ref: "#/components/schemas/PresentationTimestamp" }, { type: "null" }] }
        retry_required: { type: boolean }
        idempotent_replay: { type: boolean }
    PresentationProjectListData:
      type: object
      additionalProperties: false
      required: [schema_version, projects, count]
      properties:
        schema_version: { const: shchem.presentation-project-list.v1 }
        projects: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/PresentationProjectData" } }
        count: { type: integer, minimum: 0, maximum: 1000 }
    PresentationProjectCreateData:
      type: object
      additionalProperties: false
      required: [schema_version, project, outline]
      properties:
        schema_version: { const: shchem.presentation-project-create.v1 }
        project: { $ref: "#/components/schemas/PresentationProjectData" }
        outline: { $ref: "#/components/schemas/PresentationOutlineData" }
    PresentationProjectDetailData:
      type: object
      additionalProperties: false
      required: [schema_version, project, outline, versions]
      properties:
        schema_version: { const: shchem.presentation-project-detail.v1 }
        project: { $ref: "#/components/schemas/PresentationProjectData" }
        outline: { oneOf: [{ $ref: "#/components/schemas/PresentationOutlineData" }, { type: "null" }] }
        versions: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/PresentationVersionData" } }
    PresentationVersionListData:
      type: object
      additionalProperties: false
      required: [schema_version, versions, count]
      properties:
        schema_version: { const: shchem.presentation-version-list.v1 }
        versions: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/PresentationVersionData" } }
        count: { type: integer, minimum: 0, maximum: 1000 }
    PresentationEnvelopeBase:
      type: object
      additionalProperties: false
      required: [contract_version, request_id, data]
      properties:
        contract_version: { const: shchem.gateway.v1 }
        request_id: { type: string, minLength: 1 }
        data: {}
    PresentationProjectListEnvelope:
      allOf:
        - { $ref: "#/components/schemas/PresentationEnvelopeBase" }
        - { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PresentationProjectListData" } } }
    PresentationProjectCreateEnvelope:
      allOf:
        - { $ref: "#/components/schemas/PresentationEnvelopeBase" }
        - { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PresentationProjectCreateData" } } }
    PresentationProjectDetailEnvelope:
      allOf:
        - { $ref: "#/components/schemas/PresentationEnvelopeBase" }
        - { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PresentationProjectDetailData" } } }
    PresentationOutlineEnvelope:
      allOf:
        - { $ref: "#/components/schemas/PresentationEnvelopeBase" }
        - { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PresentationOutlineData" } } }
    PresentationVersionEnvelope:
      allOf:
        - { $ref: "#/components/schemas/PresentationEnvelopeBase" }
        - { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PresentationVersionData" } } }
    PresentationVersionListEnvelope:
      allOf:
        - { $ref: "#/components/schemas/PresentationEnvelopeBase" }
        - { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PresentationVersionListData" } } }
    PresentationJobEnvelope:
      allOf:
        - { $ref: "#/components/schemas/PresentationEnvelopeBase" }
        - { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PresentationJobData" } } }
    PaperBlueprintSha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    PaperBlueprintCandidateId:
      type: string
      pattern: '^PBC-[0-9a-f]{24}$'
    PaperBlueprintPreviewRevision:
      type: string
      pattern: '^PBREV-[0-9a-f]{32}$'
    PaperBlueprintApprovalId:
      type: string
      pattern: '^PBAPP-[0-9a-f]{32}$'
    PaperBlueprintApprovedRevision:
      type: string
      pattern: '^PBAPR-[0-9a-f]{32}$'
    PaperBlueprintTimestamp:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?Z$'
    PaperBlueprintMode:
      type: string
      enum: [mock_exam, daily_practice]
    PaperBlueprintStringId:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,239}$'
    PaperBlueprintStringIdArray:
      type: array
      maxItems: 10000
      uniqueItems: true
      items: { $ref: "#/components/schemas/PaperBlueprintStringId" }
    PaperBlueprintTextArray:
      type: array
      maxItems: 100
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 500 }
    PaperBlueprintPaginationRules:
      type: object
      additionalProperties: false
      properties:
        cover_page: { type: boolean }
        start_each_theme_on_new_page: { type: boolean }
        keep_theme_together: { type: boolean }
        keep_printed_question_together: { type: boolean }
        show_page_numbers: { type: boolean }
        keep_theme_heading_with_first_question: { const: true }
        avoid_split_within_printed_question: { const: true }
        shared_material_at_theme_level_only: { const: true }
    PaperBlueprintScoringRules:
      type: object
      additionalProperties: false
      required: [selection_rule_zh, partial_credit_rule_zh, other_rule_zh]
      properties:
        selection_rule_zh:
          oneOf:
            - { type: string, minLength: 1, maxLength: 500 }
            - { type: "null" }
        partial_credit_rule_zh:
          oneOf:
            - { type: string, minLength: 1, maxLength: 500 }
            - { type: "null" }
        other_rule_zh:
          oneOf:
            - { type: string, minLength: 1, maxLength: 500 }
            - { type: "null" }
    PaperBlueprintMockPaper:
      type: object
      additionalProperties: false
      required: [exam_name_zh, template_id, template_version, template_year, duration_minutes, total_score, theme_count, instructions_zh, scoring_rules, identity_fields_zh, sealed_line, numbering_mode]
      properties:
        exam_name_zh: { type: string, minLength: 1, maxLength: 200 }
        subtitle_zh:
          oneOf:
            - { type: string, minLength: 1, maxLength: 300 }
            - { type: "null" }
        template_id: { $ref: "#/components/schemas/PaperBlueprintStringId" }
        template_version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?$' }
        template_year: { type: integer, minimum: 2000, maximum: 2100 }
        duration_minutes: { type: integer, minimum: 1, maximum: 600 }
        duration_rule: { type: string, enum: [max, exact], default: max }
        total_score: { type: integer, minimum: 1, maximum: 500 }
        theme_count: { type: integer, minimum: 1, maximum: 20 }
        instructions_zh:
          allOf:
            - { $ref: "#/components/schemas/PaperBlueprintTextArray" }
            - { minItems: 1 }
        scoring_rules: { $ref: "#/components/schemas/PaperBlueprintScoringRules" }
        identity_fields_zh: { $ref: "#/components/schemas/PaperBlueprintTextArray" }
        sealed_line: { type: boolean }
        numbering_mode: { const: restart_within_each_theme }
        answer_space_lines: { type: integer, minimum: 0, maximum: 20, default: 3 }
        score_per_atomic: { type: integer, minimum: 1, maximum: 20, default: 1 }
        time_per_atomic_minutes: { type: number, exclusiveMinimum: 0, maximum: 300, default: 1 }
        pagination_rules: { $ref: "#/components/schemas/PaperBlueprintPaginationRules" }
    PaperBlueprintDailyPaper:
      type: object
      additionalProperties: false
      required: [title_zh]
      properties:
        title_zh: { type: string, minLength: 1, maxLength: 200 }
        subtitle_zh:
          oneOf:
            - { type: string, minLength: 1, maxLength: 300 }
            - { type: "null" }
        instructions_zh: { $ref: "#/components/schemas/PaperBlueprintTextArray" }
        identity_fields_zh: { $ref: "#/components/schemas/PaperBlueprintTextArray" }
        sealed_line: { type: boolean, default: false }
        numbering_mode: { const: restart_within_each_theme }
        answer_space_lines: { type: integer, minimum: 0, maximum: 20, default: 2 }
        score_per_atomic: { type: integer, minimum: 1, maximum: 20, default: 1 }
        time_per_atomic_minutes: { type: integer, minimum: 1, maximum: 300, default: 1 }
        pagination_rules: { $ref: "#/components/schemas/PaperBlueprintPaginationRules" }
    PaperBlueprintBoundRule:
      oneOf:
        - { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          properties:
            min: { type: integer, minimum: 0, default: 0 }
            max:
              oneOf:
                - { type: integer, minimum: 0 }
                - { type: "null" }
    PaperBlueprintAxisRules:
      type: object
      maxProperties: 1000
      additionalProperties: { $ref: "#/components/schemas/PaperBlueprintBoundRule" }
    PaperBlueprintCoverageRules:
      type: object
      additionalProperties: false
      properties:
        K: { $ref: "#/components/schemas/PaperBlueprintAxisRules" }
        A: { $ref: "#/components/schemas/PaperBlueprintAxisRules" }
        C: { $ref: "#/components/schemas/PaperBlueprintAxisRules" }
        R: { $ref: "#/components/schemas/PaperBlueprintAxisRules" }
        RP: { $ref: "#/components/schemas/PaperBlueprintAxisRules" }
    PaperBlueprintDifficultyRules:
      type: object
      additionalProperties: false
      properties:
        D1: { $ref: "#/components/schemas/PaperBlueprintBoundRule" }
        D2: { $ref: "#/components/schemas/PaperBlueprintBoundRule" }
        D3: { $ref: "#/components/schemas/PaperBlueprintBoundRule" }
        D4: { $ref: "#/components/schemas/PaperBlueprintBoundRule" }
        D5: { $ref: "#/components/schemas/PaperBlueprintBoundRule" }
    PaperBlueprintAnswerEligibilityRule:
      type: object
      additionalProperties: false
      required: [allowed_availability, require_all_selected]
      properties:
        allowed_availability:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [present_part_aligned, present_unaligned, absent] }
        allowed_authorities: { $ref: "#/components/schemas/PaperBlueprintStringIdArray" }
        allowed_source_authority: { $ref: "#/components/schemas/PaperBlueprintStringIdArray" }
        require_all_selected: { const: true }
    PaperBlueprintDedupClusters:
      type: object
      maxProperties: 10000
      additionalProperties:
        allOf:
          - { $ref: "#/components/schemas/PaperBlueprintStringIdArray" }
