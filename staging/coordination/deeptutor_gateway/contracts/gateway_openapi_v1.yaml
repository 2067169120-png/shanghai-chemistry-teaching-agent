        status: { const: ready_candidate_browse }
        api_contract_version: { const: shchem.gateway.v1 }
        ui_build_id: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        manifest_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        data_snapshot_id: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        product_registry_id: { const: SHCHEM-WORKBENCH-PRODUCT-REGISTRY-V1 }
        product_count: { const: 3 }
        product_ids:
          type: array
          prefixItems: [{ const: wave1 }, { const: master }, { const: supplemental }]
          minItems: 3
          maxItems: 3
        ui_contract_compatible: { const: true }
        ready_for_candidate_browse: { const: true }
        combined_atomic_total: { type: "null" }
        cross_scope_sum_allowed: { const: false }
        subsystem_checks:
          type: object
          additionalProperties: false
