      description: Bounded semantic value whose exact tag vocabulary is revalidated by the Gateway; it can never carry actor, authority, path, or URL keys.
      oneOf:
        - { type: "null" }
        - { type: boolean }
        - { type: number }
        - { type: string }
        - { type: array, maxItems: 512, items: { $ref: "#/components/schemas/ThemeReviewJsonValue" } }
        - type: object
          maxProperties: 64
          additionalProperties: { $ref: "#/components/schemas/ThemeReviewJsonValue" }
