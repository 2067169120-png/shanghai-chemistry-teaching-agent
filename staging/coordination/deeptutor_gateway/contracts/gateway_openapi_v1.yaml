openapi: 3.1.0
info:
  title: DeepTutor Shanghai Chemistry Gateway
  version: 1.24.0
servers:
  - url: http://127.0.0.1:8765
paths:
  /api/v1/questions/search:
    post:
      summary: 按主题大题快捷找题
      description: Read-only teacher search for the local workbench. A trusted loopback browser Origin and teacher Bearer are required, but this POST only carries a structured query and creates no question-bank or audit mutation. Filters and the optional curriculum selector are evaluated on atomic parts while a verified theme result remains a complete theme card with shared context, source order, dependency edges, the full atomic chain, and explicit matched-atomic highlights. An atomic whose parent theme is still pending review is returned only as its own isolated pending card; it is never joined to other unassigned atomics, and complete_theme_chain_returned is false whenever such a card is returned. Curriculum matches use only the frozen explicit textbook mapping index and never infer a chapter from K labels. The selected frozen release is the only data source when one is serving; no live fallback is allowed. Answer text, question text, local paths, URLs, and student data are excluded.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionSearchRequest" }
      responses:
        "200":
          description: Theme-first search results with Chinese facets and opaque cursor pagination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionSearchEnvelope" }
        "400": { description: Search scope, keyword, filters, cursor, limit, or query parameters are invalid }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "409": { description: Theme projection, selected snapshot, or response boundary is incompatible }
        "503": { description: A route required by the selected frozen release is unavailable; live fallback is forbidden }
  /api/v1/textbooks:
    get:
      summary: 读取教材册—章—节安全目录
      description: 需要教师 Bearer 与可信本机浏览器来源。返回当前服务快照中的上海高中化学五册、十九章、六十节目录及显式题级映射计数；不返回本地路径、链接、摘要哈希、题面或答案。教材章节只来自已核对目录和显式 mapping index，绝不由 K 标签反推。冻结模式只读取内存中的 catalog；旧冻结包缺少该路由时返回 browse_snapshot_runtime_incompatible，严禁回退 live。
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 当前同一 live 或 frozen browse snapshot 的 5册/19章/60节安全目录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextbookCatalogEnvelope" }
        "400": { description: 不接受 URL 查询参数 }
        "401": { description: 需要 Bearer 身份认证 }
        "403": { description: 需要教师身份与可信本机浏览器来源 }
        "409": { description: 教材目录、显式映射或快照闭包校验失败 }
        "503": { description: 所选旧冻结包不包含教材目录路由；严禁回退 live }
  /api/v1/readiness:
    get:
      summary: Read the all-or-nothing teacher workbench release locked before this process started
      description: Teacher Bearer and trusted loopback browser origin are required. The launcher fixes one serving release before the process starts, and readiness reports that same service-lifetime identity. Frozen mode never reactivates or rereads live browse bytes; bootstrap_live is only the fail-closed transition used before the first immutable release is selected. Wave1, Master, and supplemental remain explicitly non-additive, and model-provider absence does not block offline candidate browsing.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Technical candidate-browse readiness; never a human-review, teaching-use, official, generation, or publication claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchReadinessEnvelope" }
        "400": { description: Query parameters are not accepted }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "409": { description: Locked release identity, registry, UI binding, scope snapshot, authority, count, or compatibility validation failed closed }
  /api/v1/workbench/product-registry:
    get:
      summary: Read the frozen non-additive workbench browse-product registry
      description: Returns three separately counted browse products in stable Wave1, Master, and supplemental order. combined_atomic_total remains null and cross_scope_sum_allowed remains false; no question text, answer text, source locator, or local path is exposed.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Frozen UI/data snapshot identities, dynamic per-scope counts, blockers, and closed authority
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchProductRegistryEnvelope" }
        "400": { description: Query parameters are not accepted }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "409": { description: Unknown, duplicate, incompatible, partial, stale, or invalid product registry failed closed }
  /api/v1/prep/exports:
    post:
      summary: 从教师题篮启动主题式学生版与教师版导出
      description: Legacy compatibility entry point requiring a teacher Bearer principal and a trusted loopback browser Origin. It validates one exact Wave1, Master, or supplemental snapshot before queueing, recomputes complete-theme or prior-dependency closure, reads only the final selected atomic parts, and creates a persistent local background job. It is retained for the old basket UI only and does not satisfy the new authoritative whole-paper preview/approval gate; the new UI must use /api/v1/prep/blueprints/preview, /approve, and /{preview_approval_id}/export. The client cannot supply counts, answers, source paths, output paths, renderer commands, authority, or publication claims. Each atomic score is an integer from 1 to 20. A successful request returns 202 but never means the four files have completed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaperExportStartRequest" }
      responses:
        "202":
          description: 导出任务已进入本机队列；客户端应使用返回的 job_id 轮询状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperExportJobEnvelope" }
        "400": { description: 请求字段、题篮条目、分值、时长、题号方式或查询参数不正确 }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "409": { description: 题库快照漂移、跨范围混用、主题依赖、题图或答案合同失败关闭 }
        "503": { description: 本机导出队列或活动题库读取暂不可用 }
  /api/v1/prep/blueprints/preview:
    post:
      summary: 生成并保存主题优先的智能组卷候选预览
      description: Requires a teacher Bearer and trusted loopback browser Origin. Uses only the currently active scope/data snapshot, the real complete-theme catalog, every page of the existing question search, explicit textbook mapping, candidate metadata, and the selected paper preset. Returns one to three deterministic theme-first candidates without calling a model, synthesizing question text, writing the central bank, or exposing server paths. The server retains the authoritative basket selections and assembly plan under the owner/session boundary; any changed mode, selection, order, score, answer space, template, or snapshot requires a new preview revision.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaperBlueprintPreviewRequest" }
      responses:
        "200":
          description: Deterministic feasible, infeasible, or indeterminate preview projection saved for this teacher session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperBlueprintPreviewEnvelope" }
        "400": { description: Strict blueprint, search, mode, paper, basket, ordering, or constraint schema rejected }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "409": { description: Active snapshot, theme chain, mapping, search pagination, preset, metadata, dependency, or hard constraints failed closed }
        "503": { description: Active frozen projection or preview store is unavailable or corrupt }
  /api/v1/prep/blueprints/approve:
    post:
      summary: CAS 确认同一服务端组卷候选与预览哈希
      description: Requires the same teacher owner/session Bearer and trusted loopback browser Origin that created the preview. Confirms only the currently stored candidate, exact preview SHA-256, and still-current scope snapshot. Repeating the exact confirmation is idempotent. A changed preview revision, hash, owner/session, expiry, or data snapshot is rejected or hidden as not found.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaperBlueprintApproveRequest" }
      responses:
        "200":
          description: Exact preview approval and approved revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperBlueprintApprovalEnvelope" }
        "400": { description: Approval fields or identities are invalid }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Candidate is not stored for this owner/session }
        "409": { description: Preview hash, revision, or current scope snapshot differs }
        "410": { description: Preview candidate expired }
        "503": { description: Preview store is unavailable or corrupt }
  /api/v1/prep/blueprints/{preview_approval_id}/export:
    post:
      summary: 仅从已批准服务端候选启动四文件导出
      description: Requires the same teacher owner/session Bearer and trusted loopback browser Origin. The request body must be an empty JSON object. The server retrieves the exact approved candidate, preview hash, data snapshot, and retained basket selections, then derives the legacy four-file PaperExportJob request internally. Client selections, order, score, answer space, title, template, paths, and renderer inputs are forbidden. Repeating after a job was bound returns that same job.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: preview_approval_id, required: true, schema: { $ref: "#/components/schemas/PaperBlueprintApprovalId" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaperBlueprintExportRequest" }
      responses:
        "202":
          description: The approved preview has been bound to the existing local four-file job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperBlueprintApprovedExportEnvelope" }
        "400": { description: Body is not an empty object or approval identity is invalid }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Approval is not stored for this owner/session }
        "409": { description: Approval is stale, export is already starting, or the approved preview cannot be losslessly represented by the existing exporter }
        "410": { description: Approval expired }
        "503": { description: Preview store or local export queue is unavailable }
  /api/v1/prep/exports/{job_id}:
    get:
      summary: 轮询一个本机题篮导出任务
      description: Requires a teacher Bearer principal and a trusted loopback browser Origin. Returns bounded queued, running, completed, or failed state without exposing the original request, local output paths, renderer commands, or answer content. Query parameters are not accepted.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: job_id, required: true, schema: { $ref: "#/components/schemas/PaperExportJobId" } }
      responses:
        "200":
          description: 当前持久化任务状态；completed 时包含四个可下载 artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperExportJobEnvelope" }
        "400": { description: 查询参数不受支持 }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: 找不到指定导出任务 }
        "409": { description: 持久化任务记录损坏或不一致 }
  /api/v1/prep/exports/{job_id}/artifacts/{artifact_id}:
    get:
      summary: 下载学生版或教师版 DOCX/PDF
      description: Requires a teacher Bearer principal and a trusted loopback browser Origin. The server accepts only the four enumerated artifact identities, re-verifies the completed artifact SHA-256 before every download, and returns attachment Content-Disposition. Query parameters and client paths are not accepted.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: job_id, required: true, schema: { $ref: "#/components/schemas/PaperExportJobId" } }
        - { in: path, name: artifact_id, required: true, schema: { $ref: "#/components/schemas/PaperExportArtifactId" } }
      responses:
        "200":
          description: 经当前哈希复核的 DOCX 或 PDF 二进制附件
          headers:
            Content-Disposition:
              description: attachment filename with UTF-8 filename* form
              schema: { type: string, pattern: '^attachment;' }
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "400": { description: 查询参数不受支持 }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: 找不到指定任务或 artifact 记录 }
        "409": { description: 任务尚未完成、文件缺失或下载前哈希漂移 }
  /api/v1/presentations/projects:
    get:
      summary: 读取当前教师的本地课程 PPT 项目
      description: Requires a teacher Bearer and trusted loopback browser Origin. Returns only persistent candidate project metadata; local paths, API keys, student identifiers, and provider payloads are excluded. Query parameters are rejected.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: PPT 项目列表, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationProjectListEnvelope" } } } }
        "400": { description: Query parameters are not accepted }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "503": { description: Local presentation toolchain unavailable; offline question browsing remains available }
    post:
      summary: 从活动题库的一个完整主题创建课程 PPT 项目和页纲
      description: Requires a teacher Bearer and trusted loopback browser Origin. The client submits teacher-facing lesson settings plus scope, snapshot, and theme identity. The server resolves the complete four-level theme chain, details, reference-answer boundary, and verified question/shared-material crops. Client paths, hashes, source authority, answer authority, output directories, and publication claims are not accepted.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationThemeRequest" } } } }
      responses:
        "201": { description: 真实完整主题已投影为持久项目和页纲, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationProjectCreateEnvelope" } } } }
        "400": { description: Teacher lesson settings or theme fields invalid }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Theme not found }
        "409": { description: Snapshot, hierarchy, details, crop, or answer boundary failed closed }
        "503": { description: Local presentation toolchain unavailable }
  /api/v1/presentations/projects/{project_id}:
    get:
      summary: 读取一个课程 PPT 项目、当前页纲与不可变版本
      description: Requires the owning teacher and trusted loopback browser Origin. Owner mismatches are hidden as not found and query parameters are rejected.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: project_id, required: true, schema: { $ref: "#/components/schemas/PresentationProjectId" } }]
      responses:
        "200": { description: PPT 项目详情, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationProjectDetailEnvelope" } } } }
        "400": { description: Query parameters are not accepted }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Project not found for this teacher }
        "409": { description: Project, outline, or version record corrupt }
        "503": { description: Local presentation toolchain unavailable }
  /api/v1/presentations/projects/{project_id}/outline:
    get:
      summary: 读取一个课程 PPT 项目的当前页纲
      description: Requires the owning teacher and trusted loopback browser Origin. Returns the current candidate Deck JSON projection without internal input records or local asset paths; query parameters are rejected.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: project_id, required: true, schema: { $ref: "#/components/schemas/PresentationProjectId" } }]
      responses:
        "200": { description: 当前 PPT 页纲, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationOutlineEnvelope" } } } }
        "400": { description: Query parameters are not accepted }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Project or outline not found }
        "409": { description: Project or outline record corrupt }
        "503": { description: Local presentation toolchain unavailable }
    patch:
      summary: 以 CAS 保存教师编辑后的 Deck JSON 页纲
      description: Requires the owning teacher and trusted loopback browser Origin. The current revision is required. The strict generic deck, theme binding, asset references, timings, sources, and candidate boundary are revalidated.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: project_id, required: true, schema: { $ref: "#/components/schemas/PresentationProjectId" } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationOutlineUpdateRequest" } } } }
      responses:
        "200": { description: 新页纲修订, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationOutlineEnvelope" } } } }
        "400": { description: Outline fields, Deck JSON, or revision invalid }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Project or outline not found }
        "409": { description: Revision conflict, asset drift, or theme binding drift }
        "503": { description: Local presentation toolchain unavailable }
  /api/v1/presentations/projects/{project_id}/versions:
    get:
      summary: 读取一个课程 PPT 项目的不可变版本列表
      description: Requires the owning teacher and trusted loopback browser Origin. Returns candidate version projections without frozen input bodies, local paths, or renderer details; query parameters are rejected.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: project_id, required: true, schema: { $ref: "#/components/schemas/PresentationProjectId" } }]
      responses:
        "200": { description: 不可变 PPT 版本列表, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationVersionListEnvelope" } } } }
        "400": { description: Query parameters are not accepted }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Project not found }
        "409": { description: Project or version record corrupt }
        "503": { description: Local presentation toolchain unavailable }
    post:
      summary: 从当前页纲冻结内容寻址的不可变 PPT 版本
      description: Requires the owning teacher and trusted loopback browser Origin. The request contains only the expected outline revision; repeating the same version is idempotent.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: project_id, required: true, schema: { $ref: "#/components/schemas/PresentationProjectId" } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationVersionCreateRequest" } } } }
      responses:
        "201": { description: 不可变版本, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationVersionEnvelope" } } } }
        "400": { description: Outline revision invalid }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Project or outline not found }
        "409": { description: Outline changed or frozen input drifted }
        "503": { description: Local presentation toolchain unavailable }
  /api/v1/presentations/projects/{project_id}/versions/{version_id}:
    get:
      summary: 读取一个内容寻址的不可变 PPT 版本
      description: Requires the owning teacher and trusted loopback browser Origin. Returns only the immutable candidate version projection; frozen inputs, local paths, and renderer commands remain private. Query parameters are rejected.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: project_id, required: true, schema: { $ref: "#/components/schemas/PresentationProjectId" } }
        - { in: path, name: version_id, required: true, schema: { $ref: "#/components/schemas/PresentationVersionId" } }
      responses:
        "200": { description: 不可变 PPT 版本, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationVersionEnvelope" } } } }
        "400": { description: Query parameters are not accepted }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Project or version not found }
        "409": { description: Project or version record corrupt }
        "503": { description: Local presentation toolchain unavailable }
  /api/v1/presentations/projects/{project_id}/versions/{version_id}/renders:
    post:
      summary: 启动本机可编辑 PPTX、逐页预览和版面 QA 生成
      description: Requires the owning teacher and trusted loopback browser Origin. The body must be empty. Renderer, commands, output paths, environment, authority, and publication state are server controlled; repeating the same immutable version returns the same persistent job.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: project_id, required: true, schema: { $ref: "#/components/schemas/PresentationProjectId" } }
        - { in: path, name: version_id, required: true, schema: { $ref: "#/components/schemas/PresentationVersionId" } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationEmptyRequest" } } } }
      responses:
        "202": { description: PPT 生成任务已进入本机队列, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationJobEnvelope" } } } }
        "400": { description: Body must be an empty object }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Project or immutable version not found }
        "409": { description: Version, asset, or project binding mismatch }
        "503": { description: Local presentation toolchain unavailable }
  /api/v1/presentations/jobs/{job_id}:
    get:
      summary: 轮询本机课程 PPT 生成任务
      description: Requires the owning teacher and trusted loopback browser Origin. Returns queued, running, cancel_requested, completed, failed, or cancelled without local paths or renderer commands.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: job_id, required: true, schema: { $ref: "#/components/schemas/PresentationJobId" } }]
      responses:
        "200": { description: PPT 任务状态, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationJobEnvelope" } } } }
        "400": { description: Query parameters are not accepted }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Job not found for this teacher }
        "409": { description: Job record corrupt }
        "503": { description: Local presentation toolchain unavailable }
  /api/v1/presentations/jobs/{job_id}/cancel:
    post:
      summary: 请求取消运行中的 PPT 生成任务
      description: Requires the owning teacher and trusted loopback browser Origin. The body must be empty; cancellation never accepts partial artifacts.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: job_id, required: true, schema: { $ref: "#/components/schemas/PresentationJobId" } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationEmptyRequest" } } } }
      responses:
        "200": { description: Cancellation requested or completed, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationJobEnvelope" } } } }
        "400": { description: Body must be an empty object }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Job not found }
        "409": { description: Terminal job cannot be cancelled }
        "503": { description: Local presentation toolchain unavailable }
  /api/v1/presentations/jobs/{job_id}/retry:
    post:
      summary: 显式重试失败或取消且可重试的 PPT 任务
      description: Requires the owning teacher and trusted loopback browser Origin. The body must be empty. The immutable version is revalidated and partial artifacts are never reused.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: job_id, required: true, schema: { $ref: "#/components/schemas/PresentationJobId" } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationEmptyRequest" } } } }
      responses:
        "202": { description: New attempt queued, content: { application/json: { schema: { $ref: "#/components/schemas/PresentationJobEnvelope" } } } }
        "400": { description: Body must be an empty object }
        "401": { description: Bearer authentication required }
        "403": { description: Teacher principal and trusted loopback Origin required }
        "404": { description: Job not found }
        "409": { description: Job is not retryable }
        "503": { description: Local presentation toolchain unavailable }
  /api/v1/presentations/jobs/{job_id}/artifacts/{artifact_id}:
    get:
      summary: 下载固定白名单中的课程 PPT 候选产物
      description: Requires the owning teacher and trusted loopback browser Origin. Only deck_json, pptx, qa_report, or preview_montage may be downloaded after completion. Bytes are rehashed before download and local paths are never returned.
      security: [{ bearerAuth: [] }]
      parameters:
