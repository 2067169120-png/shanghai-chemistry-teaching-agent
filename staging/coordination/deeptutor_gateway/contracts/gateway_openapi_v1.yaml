        message_zh: { type: string, minLength: 1, maxLength: 300 }
    WorkbenchBrowseProduct:
      type: object
      additionalProperties: false
      required: [product_id, display_name_zh, scope, schema_version, status, compatible, data_snapshot_id, manifest_sha256, counts, blockers, non_additive_to]
      properties:
        product_id: { type: string, enum: [wave1, master, supplemental] }
        display_name_zh: { type: string, minLength: 1, maxLength: 40 }
        scope: { type: string, enum: [wave1, master, supplemental] }
        schema_version: { const: 1.0.0-theme-workbench-candidate }
        status: { const: ready_candidate_browse }
        compatible: { const: true }
        data_snapshot_id: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        manifest_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        counts: { $ref: "#/components/schemas/WorkbenchProductCountSet" }
        blockers:
