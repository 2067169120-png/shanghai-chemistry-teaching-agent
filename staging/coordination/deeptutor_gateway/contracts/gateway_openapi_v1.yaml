      required: [schema_version, registry_id, api_contract_version, ui_build_id, manifest_sha256, data_snapshot_id, data_snapshot_algorithm, product_count, product_order, products, combined_atomic_total, cross_scope_sum_allowed, scope_boundary_zh, authority, integrity]
      properties:
        schema_version: { const: 1.0.0-workbench-product-registry }
        registry_id: { const: SHCHEM-WORKBENCH-PRODUCT-REGISTRY-V1 }
        api_contract_version: { const: shchem.gateway.v1 }
        ui_build_id: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        manifest_sha256: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        data_snapshot_id: { $ref: "#/components/schemas/WorkbenchRegistrySha256" }
        data_snapshot_algorithm: { const: canonical-sha256-of-workbench-product-projections-v1 }
        product_count: { const: 3 }
        product_order:
          type: array
          prefixItems: [{ const: wave1 }, { const: master }, { const: supplemental }]
