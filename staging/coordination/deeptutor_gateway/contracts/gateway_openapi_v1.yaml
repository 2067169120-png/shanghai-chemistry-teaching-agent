    ModelProviderProfileId:
      type: string
      pattern: '^(?!.*\.\.)[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
    ModelProviderModelId:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,239}$'
      not: { pattern: '(?:\.\.|//|[/:]$)' }
    ModelProviderRevision:
      type: string
      pattern: '^rev_[0-9a-f]{32}$'
    ModelProviderProbeRunId:
      type: string
      pattern: '^probe_[0-9a-f]{32}$'
    ModelProviderProbeReceiptId:
      type: string
      pattern: '^probe-receipt-[0-9a-f]{32}$'
    ModelProviderProbeTimestamp:
      type: string
      format: date-time
      minLength: 20
      maxLength: 40
    ModelProviderProbeTokenUsage:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens: { type: integer, minimum: 0, maximum: 1000000 }
        output_tokens: { type: integer, minimum: 0, maximum: 1000000 }
        total_tokens: { type: integer, minimum: 0, maximum: 1000000 }
    ModelProviderLastProbe:
      oneOf:
        - { type: "null" }
        - type: object
          additionalProperties: false
          required: [status, checked_at, error_code, model_invoked, connection_state, probe_run_id, receipt_id, receipt_sha256, latency_ms, usage]
          properties:
            status: { type: string, enum: [never, ready_not_invoked, succeeded, failed, cancelled, stale] }
            checked_at:
              oneOf:
                - { $ref: "#/components/schemas/ModelProviderProbeTimestamp" }
                - { type: "null" }
            error_code:
              oneOf:
                - { type: string, pattern: '^[a-z0-9_]{1,96}$' }
                - { type: "null" }
            model_invoked: { type: boolean }
            connection_state: { type: string, enum: [not_started, connected, failed, cancelled, stale] }
            probe_run_id:
              oneOf:
                - { $ref: "#/components/schemas/ModelProviderProbeRunId" }
                - { type: "null" }
            receipt_id:
              oneOf:
                - { $ref: "#/components/schemas/ModelProviderProbeReceiptId" }
                - { type: "null" }
            receipt_sha256:
              oneOf:
                - { type: string, pattern: '^[0-9a-f]{64}$' }
                - { type: "null" }
            latency_ms:
              oneOf:
                - { type: integer, minimum: 0, maximum: 60000 }
                - { type: "null" }
            usage:
              oneOf:
                - { $ref: "#/components/schemas/ModelProviderProbeTokenUsage" }
                - { type: "null" }
    ModelProviderProfile:
      type: object
      additionalProperties: false
      required: [profile_id, provider_kind, provider_id, display_name, model_id, model_status, base_url_policy, base_url, api_style, local_endpoint_policy, endpoint_scope, credential_ref, revision, capabilities, effective_capabilities, capability_evidence, allowed_data_classes, image_egress, last_probe, follow_redirects, credential_state, model_configured, offline_workbench_available]
      properties:
        profile_id: { $ref: "#/components/schemas/ModelProviderProfileId" }
        provider_kind: { type: string, enum: [preset, openai_compatible] }
        provider_id: { type: string, enum: [openai, deepseek, openai_compatible] }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        model_id: { $ref: "#/components/schemas/ModelProviderModelId" }
        model_status: { type: string, enum: [catalog_model, unverified_custom_model] }
        base_url_policy: { type: string, enum: [openai_official_https_v1, deepseek_official_https_v1, openai_compatible_public_https_v1, openai_compatible_loopback_v1] }
        base_url: { type: string, format: uri, minLength: 8, maxLength: 2048 }
        api_style: { type: string, enum: [responses, chat_completions] }
        local_endpoint_policy: { type: string, enum: [deny, allow_loopback_http] }
        endpoint_scope: { type: string, enum: [public_https, loopback] }
        credential_ref: { type: string, pattern: '^ShanghaiChemWorkbench/model-provider/[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$' }
        revision: { $ref: "#/components/schemas/ModelProviderRevision" }
        capabilities:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [text, vision, structured_output] }
        effective_capabilities:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [text, vision, structured_output] }
        capability_evidence: { $ref: "#/components/schemas/ModelProviderCapabilityEvidence" }
        allowed_data_classes:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          contains: { const: synthetic_only }
          items: { type: string, enum: [synthetic_only, question_text_redacted, question_image_redacted, source_page_image, student_answer_image, deidentified_student_text] }
        image_egress: { type: string, enum: [deny, redacted_question_only, teacher_confirmed_source_pages, teacher_confirmed_student_pages, teacher_confirmed_visual_pages] }
        last_probe: { $ref: "#/components/schemas/ModelProviderLastProbe" }
        follow_redirects: { const: false }
        credential_state: { type: string, enum: [configured, not_configured, credential_store_unavailable] }
        model_configured: { type: boolean }
        offline_workbench_available: { const: true }
      allOf:
        - if: { properties: { provider_id: { const: openai_compatible } }, required: [provider_id] }
          then:
            properties:
              provider_kind: { const: openai_compatible }
              base_url_policy: { type: string, enum: [openai_compatible_public_https_v1, openai_compatible_loopback_v1] }
        - if: { properties: { provider_kind: { const: openai_compatible } }, required: [provider_kind] }
          then:
            properties:
              provider_id: { const: openai_compatible }
        - if: { properties: { provider_kind: { const: preset } }, required: [provider_kind] }
          then:
            properties:
              provider_id: { type: string, enum: [openai, deepseek] }
        - if: { properties: { provider_id: { const: openai } }, required: [provider_id] }
          then:
            properties:
              provider_kind: { const: preset }
              base_url_policy: { const: openai_official_https_v1 }
              base_url: { const: 'https://api.openai.com/v1' }
              api_style: { const: responses }
              local_endpoint_policy: { const: deny }
              endpoint_scope: { const: public_https }
        - if: { properties: { provider_id: { const: deepseek } }, required: [provider_id] }
          then:
            properties:
              provider_kind: { const: preset }
              base_url_policy: { const: deepseek_official_https_v1 }
              base_url: { const: 'https://api.deepseek.com' }
              api_style: { const: chat_completions }
              local_endpoint_policy: { const: deny }
              endpoint_scope: { const: public_https }
        - if: { properties: { base_url_policy: { const: openai_compatible_public_https_v1 } }, required: [base_url_policy] }
          then:
            properties:
              provider_kind: { const: openai_compatible }
              provider_id: { const: openai_compatible }
              base_url: { type: string, pattern: '^https://(?!(?:localhost(?::|/|$)|127\.|10\.|192\.168\.|169\.254\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|\[::1\](?::|/|$)))(?:[A-Za-z0-9.-]+|\[[0-9A-Fa-f:]+\])(?::[0-9]+)?(?:/[A-Za-z0-9._~-]+)*$' }
              local_endpoint_policy: { const: deny }
              endpoint_scope: { const: public_https }
        - if: { properties: { base_url_policy: { const: openai_compatible_loopback_v1 } }, required: [base_url_policy] }
          then:
            properties:
              provider_kind: { const: openai_compatible }
              provider_id: { const: openai_compatible }
              base_url: { type: string, pattern: '^https?://(?:(?:[A-Za-z0-9-]+\.)*localhost|127(?:\.[0-9]{1,3}){3}|\[::1\])(?::[0-9]+)?(?:/[A-Za-z0-9._~-]+)*$' }
