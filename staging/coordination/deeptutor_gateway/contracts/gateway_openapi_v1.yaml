            overlay_static_binding: { $ref: "#/components/schemas/WorkbenchSubsystemCheck" }
            offline_browse: { $ref: "#/components/schemas/WorkbenchSubsystemCheck" }
            full_bank_readiness: { $ref: "#/components/schemas/WorkbenchSubsystemCheck" }
        blockers:
          type: array
