      properties:
        candidate_only: { const: true }
        read_only: { const: true }
        human_reviewed: { const: false }
        official: { const: false }
        retrieval_ready: { const: false }
        teaching_use_allowed: { const: false }
        generation_allowed: { const: false }
        publication_allowed: { const: false }
    WorkbenchProductCountSet:
