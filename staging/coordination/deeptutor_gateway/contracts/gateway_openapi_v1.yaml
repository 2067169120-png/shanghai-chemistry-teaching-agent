        products:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/WorkbenchBrowseProduct" }
        combined_atomic_total: { type: "null" }
        cross_scope_sum_allowed: { const: false }
        scope_boundary_zh: { type: string, minLength: 1, maxLength: 300 }
        authority: { $ref: "#/components/schemas/WorkbenchRegistryAuthority" }
        integrity: { $ref: "#/components/schemas/WorkbenchRegistryIntegrity" }
    WorkbenchSubsystemCheck:
      type: object
      additionalProperties: false
      required: [status, blockers]
