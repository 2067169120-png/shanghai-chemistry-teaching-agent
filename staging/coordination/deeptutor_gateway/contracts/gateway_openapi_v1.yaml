          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/R18GovernanceFindingSummary" }
        reason_codes:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9_]{0,95}$' }
        artifact:
          anyOf:
            - { $ref: "#/components/schemas/R18HashBytes" }
            - { type: "null" }
